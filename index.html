<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fitness OS Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07080b; --elev:#0f1219; --card:#151922; --card2:#1b202b;
    --line:#242b38; --line2:#1a1f29;
    --tx:#f1f4f9; --dim:#98a1b3; --faint:#59617355;
    --faint2:#5c6474;
    --lime:#c9ff57; --violet:#8f7bff; --coral:#ff5d73; --amber:#ffb545; --cyan:#4ee3d0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg)}
  body{font-family:'Cairo',sans-serif;color:var(--tx);display:flex;justify-content:center;min-height:100vh}
  .num{font-family:'Oswald',sans-serif}
  #shell{width:100%;max-width:480px;min-height:100vh;position:relative;
    background:radial-gradient(600px 300px at 90% -10%,rgba(201,255,87,.07),transparent 60%),
               radial-gradient(500px 260px at -10% 8%,rgba(143,123,255,.08),transparent 60%),
               radial-gradient(420px 240px at 50% 60%,rgba(78,227,208,.04),transparent 70%),var(--bg);
    display:flex;flex-direction:column;border-inline:1px solid var(--line2)}
  .topbar{position:sticky;top:0;z-index:20;padding:16px 18px 12px;
    background:linear-gradient(180deg,rgba(7,8,11,.97),rgba(7,8,11,.84) 70%,transparent);
    backdrop-filter:blur(10px) saturate(140%);-webkit-backdrop-filter:blur(10px) saturate(140%);
    display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.04)}
  .logo{font-family:'Oswald',sans-serif;font-weight:700;font-size:19px;display:flex;align-items:center;gap:7px}
  .logo .dot{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime)}
  .sub{font-size:11.5px;color:var(--dim);margin-top:2px}
  .pill{display:flex;align-items:center;gap:5px;background:rgba(21,25,34,.6);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.08);padding:6px 11px;border-radius:99px;font-size:12.5px;font-weight:700}
  #view{flex:1;padding:2px 18px 108px}
  .st{font-size:12px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;
    margin:20px 2px 9px;display:flex;justify-content:space-between;align-items:center}
  .st .tag{font-size:11px;color:var(--faint2);text-transform:none;letter-spacing:0}
  .card{background:linear-gradient(180deg,rgba(27,32,43,.72),rgba(21,25,34,.55));
    backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
    border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:15px;margin-bottom:11px;
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 14px 30px -22px rgba(0,0,0,.7);
    transition:transform .28s cubic-bezier(.16,1,.3,1),box-shadow .28s;
    animation:cardIn .5s cubic-bezier(.16,1,.3,1) both}
  .card:active{transform:scale(.984)}
  #view>.card:nth-of-type(1),#view>.st:nth-of-type(1)+.card{animation-delay:.02s}
  #view>.card:nth-of-type(2){animation-delay:.06s}
  #view>.card:nth-of-type(3){animation-delay:.1s}
  #view>.card:nth-of-type(4){animation-delay:.14s}
  #view>.card:nth-of-type(5){animation-delay:.18s}
  @keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
  .flush{padding:0;overflow:hidden}
  .row{display:flex;align-items:center;justify-content:space-between}
  .btn{border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:700;border-radius:10px;
    padding:11px 15px;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s}
  .btn:active{transform:scale(.96)}
  .p{background:var(--lime);color:#0c1206}
  .g{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
  .d{background:rgba(255,93,115,.12);color:var(--coral);border:1px solid rgba(255,93,115,.25)}
  .blk{width:100%}
  .sm{padding:7px 11px;font-size:12px;border-radius:8px}
  input,select,textarea{width:100%;background:var(--elev);border:1px solid var(--line);color:var(--tx);
    border-radius:9px;padding:10px 11px;font-family:'Cairo',sans-serif;font-size:13.5px;outline:none}
  input:focus,select:focus{border-color:var(--lime)}
  label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--dim);margin-bottom:10px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
  .chip{font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--card2);
    color:var(--dim);border:1px solid var(--line);display:inline-block}
  .c-lime{background:rgba(201,255,87,.12);color:var(--lime);border-color:rgba(201,255,87,.25)}
  .c-vio{background:rgba(143,123,255,.14);color:var(--violet);border-color:rgba(143,123,255,.3)}
  .c-cor{background:rgba(255,93,115,.12);color:var(--coral);border-color:rgba(255,93,115,.3)}
  .c-amb{background:rgba(255,181,69,.12);color:var(--amber);border-color:rgba(255,181,69,.3)}
  .c-cy{background:rgba(78,227,208,.12);color:var(--cyan);border-color:rgba(78,227,208,.3)}
  .div{height:1px;background:var(--line2);margin:12px 0}
  /* hero ring */
  .hero{display:flex;align-items:center;gap:16px;padding:18px 15px}
  .ringw{position:relative;width:126px;height:126px;flex-shrink:0}
  .ring{width:126px;height:126px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:conic-gradient(var(--lime) calc(var(--pct)*1%),var(--card2) 0);transition:background .9s cubic-bezier(.16,1,.3,1)}
  .ring::before{content:"";position:absolute;inset:10px;background:var(--card);border-radius:50%}
  .ri{position:relative;z-index:2;text-align:center}
  .ri .v{font-size:25px;font-weight:700;line-height:1;font-family:'Oswald',sans-serif}
  .ri .l{font-size:10px;color:var(--faint2);margin-top:3px}
  .hs{flex:1;display:flex;flex-direction:column;gap:8px}
  .hr{display:flex;justify-content:space-between;align-items:baseline}
  .hr .k{font-size:12px;color:var(--dim)}
  .hr .v{font-size:13.5px;font-weight:700}
  .mb{display:flex;flex-direction:column;gap:9px;margin-top:13px}
  .mr{display:flex;align-items:center;gap:9px}
  .ml{width:52px;font-size:11.5px;color:var(--dim);font-weight:700;flex-shrink:0}
  .mt{flex:1;height:7px;background:var(--elev);border-radius:99px;overflow:hidden}
  .mf{height:100%;border-radius:99px;transition:width .8s cubic-bezier(.16,1,.3,1)}
  .mv{width:66px;text-align:left;font-size:10.5px;color:var(--faint2)}
  /* list item */
  .li{display:flex;align-items:center;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--line2);gap:10px}
  .li:last-child{border-bottom:none}
  .li .n{font-weight:700;font-size:13.8px}
  .li .m{font-size:11px;color:var(--faint2);margin-top:3px;line-height:1.5}
  .ib{width:33px;height:33px;border-radius:9px;background:var(--card2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--tx);cursor:pointer;font-size:14px;flex-shrink:0}
  .ib:active{transform:scale(.92)}
  .empty{text-align:center;padding:26px 14px;color:var(--faint2);font-size:13px}
  .empty .b{font-size:28px;margin-bottom:6px}
  /* onboarding */
  .ob{padding:8px 0}
  .ob h1{font-family:'Oswald',sans-serif;font-size:26px;margin:6px 0 4px;font-weight:700}
  .ob p.lead{color:var(--dim);font-size:13px;line-height:1.7;margin:0 0 18px}
  .steps{display:flex;gap:5px;margin-bottom:20px}
  .sdot{flex:1;height:3px;border-radius:9px;background:var(--card2)}
  .sdot.on{background:var(--lime)}
  .opt{display:block;width:100%;text-align:right;background:var(--card);border:1.5px solid var(--line2);
    border-radius:13px;padding:14px;margin-bottom:9px;cursor:pointer;color:var(--tx);font-family:'Cairo',sans-serif}
  .opt:active{transform:scale(.985)}
  .opt.sel{border-color:var(--lime);background:rgba(201,255,87,.06)}
  .opt .t{font-weight:700;font-size:14.5px}
  .opt .d2{font-size:11.5px;color:var(--faint2);margin-top:4px;line-height:1.6}
  .q{font-size:16px;font-weight:700;margin:0 0 13px}
  /* week strip */
  .ws{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
  .ws::-webkit-scrollbar{display:none}
  .dc{flex-shrink:0;width:66px;padding:11px 0 9px;border-radius:14px;text-align:center;
    background:var(--card);border:1px solid var(--line2);cursor:pointer}
  .dc.act{background:var(--lime);border-color:var(--lime)}
  .dc.act .dn,.dc.act .dd{color:#0c1206}
  .dc .dn{font-size:12px;font-weight:700}
  .dc .dd{font-size:9.5px;color:var(--faint2);margin-top:5px;padding:0 3px;line-height:1.3}
  .dc.tdy{box-shadow:0 0 0 2px var(--lime) inset}
  .dc.tdy.act{box-shadow:none}
  /* set logger */
  .setrow{display:flex;gap:7px;align-items:center;margin-bottom:7px}
  .setrow .sn{width:26px;font-size:11px;color:var(--faint2);font-weight:700;flex-shrink:0}
  .setrow input{padding:8px;text-align:center;font-size:13px}
  .setrow .u{font-size:10.5px;color:var(--faint2);width:22px;flex-shrink:0}
  /* nav */
  .nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
    background:rgba(15,18,25,.85);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);
    border-top:1px solid rgba(255,255,255,.06);
    display:flex;padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:30}
  .nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;
    color:var(--faint2);font-family:'Cairo',sans-serif;padding:6px 0;cursor:pointer;font-size:10px;font-weight:700}
  .nb .ic{font-size:18px;line-height:1}
  .nb.on{color:var(--lime)}
  #toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(18px);background:var(--tx);
    color:#0c1206;font-weight:700;font-size:13px;padding:10px 18px;border-radius:99px;opacity:0;
    pointer-events:none;transition:all .3s cubic-bezier(.16,1,.3,1);z-index:100;white-space:nowrap;max-width:88%}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  select option{background:var(--elev)}
  ::-webkit-scrollbar{width:0;height:0}
  .tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
  .tb{flex-shrink:0;padding:7px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line2);
    font-size:12px;font-weight:700;color:var(--dim);cursor:pointer;font-family:'Cairo',sans-serif}
  .tb.on{background:var(--lime);color:#0c1206;border-color:var(--lime)}
  /* notifications */
  .bell{position:relative;background:rgba(21,25,34,.6);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);color:var(--tx);
    width:36px;height:36px;border-radius:99px;display:flex;align-items:center;justify-content:center;
    font-size:16px;cursor:pointer;transition:transform .2s}
  .bell:active{transform:scale(.94)}
  .bdg{position:absolute;top:-3px;left:-3px;background:var(--coral);color:#fff;font-size:9.5px;font-weight:800;
    min-width:16px;height:16px;border-radius:99px;display:flex;align-items:center;justify-content:center;
    padding:0 3px;border:2px solid var(--bg);font-family:'Oswald',sans-serif}
  .syncdot{position:absolute;bottom:-1px;right:-1px;width:10px;height:10px;border-radius:50%;
    border:2px solid var(--bg);display:none}
  .syncdot.pending{display:block;background:var(--amber);animation:pulseDot 1s ease-in-out infinite}
  .syncdot.synced{display:block;background:var(--lime)}
  .syncdot.error{display:block;background:var(--coral)}
  @keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}
  .toprow{display:flex;align-items:center;gap:8px}
  .swrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 2px}
  .swrow .tt{font-size:13.5px;font-weight:700}
  .swrow .dd{font-size:11px;color:var(--faint2);margin-top:2px;line-height:1.6}
  .sw{position:relative;width:42px;height:24px;border-radius:99px;background:var(--card2);border:1px solid var(--line);
    cursor:pointer;flex-shrink:0;transition:background .15s}
  .sw.on{background:var(--lime);border-color:var(--lime)}
  .sw::after{content:"";position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:#fff;
    transition:transform .15s}
  .sw.on::after{transform:translateX(-18px)}
  .nrow{display:flex;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line2)}
  .nrow:last-child{border-bottom:none}
  .nrow .ic2{width:34px;height:34px;border-radius:9px;background:var(--card2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
  .nrow .nt{font-weight:700;font-size:13px}
  .nrow .nb2{font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.6}
  .nrow .nm{font-size:10px;color:var(--faint2);margin-top:4px}
  .nrow.unread{background:rgba(201,255,87,.04)}
  .permbox{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--elev);
    border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:12px}

  /* ---------- motion / glass / ripple / skeleton ---------- */
  .btn,.nb,.ib,.opt,.bell,.tb{position:relative;overflow:hidden}
  .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);
    transform:scale(0);pointer-events:none;animation:rippleAnim .55s ease-out forwards}
  .p .ripple{background:rgba(12,18,6,.35)}
  .tb.on .ripple{background:rgba(12,18,6,.3)}
  @keyframes rippleAnim{to{transform:scale(1);opacity:0}}

  #view{animation:none}
  #view.page-enter{animation:pageIn .42s cubic-bezier(.16,1,.3,1)}
  @keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

  .nav{transition:background .2s}
  .nb{transition:color .25s}
  .nb .ic{transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
  .nb.on .ic{transform:translateY(-2px) scale(1.12)}
  #navInd{position:absolute;bottom:6px;height:3px;width:22px;border-radius:99px;background:var(--lime);
    box-shadow:0 0 8px var(--lime);transition:left .32s cubic-bezier(.34,1.56,.64,1);pointer-events:none}

  .ring{transition:background 1.1s cubic-bezier(.16,1,.3,1)}
  .mf{transition:width 1s cubic-bezier(.16,1,.3,1)}

  .skel{background:linear-gradient(100deg,var(--card) 30%,var(--card2) 45%,var(--card) 60%);
    background-size:250% 100%;animation:shimmer 1.5s ease-in-out infinite;border-radius:9px}
  @keyframes shimmer{0%{background-position:180% 0}100%{background-position:-80% 0}}
  .skel-hero{display:flex;align-items:center;gap:16px;padding:18px 15px}
  .skel-ring{width:126px;height:126px;border-radius:50%;flex-shrink:0}
  .skel-lines{flex:1;display:flex;flex-direction:column;gap:10px}
  .skel-ln{height:11px;border-radius:6px}
  .skel-row{display:flex;align-items:center;gap:10px;padding:11px 4px}
  .skel-sq{width:40px;height:40px;border-radius:10px;flex-shrink:0}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
      transition-duration:.001ms!important;scroll-behavior:auto!important}
  }

  /* progress engine rings */
  .tt{font-size:13.5px;font-weight:700}
  .dd{font-size:11px;color:var(--faint2);margin-top:2px;line-height:1.6}
  .mrings{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 2px}
  .mringbtn{background:none;border:none;padding:6px 2px;cursor:pointer;font-family:'Cairo',sans-serif;
    border-radius:12px;transition:background .2s,transform .2s;display:block;width:100%}
  .mringbtn:active{transform:scale(.94)}
  .mringbtn.sel{background:rgba(255,255,255,.05)}
  .mring{position:relative;width:100%;aspect-ratio:1;border-radius:50%;
    display:flex;align-items:center;justify-content:center}
  .mring::before{content:"";position:absolute;inset:12%;background:var(--elev);border-radius:50%}
  .mring .mv{position:relative;z-index:2;width:auto;text-align:center;
    font-family:'Oswald',sans-serif;font-weight:700;font-size:15px;color:var(--tx)}
  .mringbtn.sel .mring::after{content:"";position:absolute;inset:-4px;border-radius:50%;
    border:1.5px solid currentColor;opacity:.55}
  .mlbl{text-align:center;font-size:10px;color:var(--dim);margin-top:7px;font-weight:700;line-height:1.4}
  .mringbtn.sel .mlbl{color:var(--tx)}
  .pblock{border-top:1px solid var(--line2);padding:13px 2px}
  .pblock:first-child{border-top:none;padding-top:4px}
  .pblock.dim{opacity:.45}
  .subbar{display:flex;align-items:center;gap:9px;margin-top:9px}
  .subbar .sl{width:74px;font-size:11px;color:var(--dim);font-weight:700;flex-shrink:0}
  .subbar .stk{flex:1;height:7px;background:var(--elev);border-radius:99px;overflow:hidden}
  .subbar .sf{height:100%;border-radius:99px;width:0;transition:width .9s cubic-bezier(.16,1,.3,1)}
  .subbar .sv{width:62px;text-align:left;font-size:10.5px;color:var(--faint2);flex-shrink:0}
</style>
</head>
<body>
<div id="shell">
  <div class="topbar">
    <div>
      <div class="logo"><span class="dot"></span>Fitness OS Pro</div>
      <div class="sub" id="topSub">—</div>
    </div>
    <div class="toprow">
      <button class="bell" id="bellBtn" data-a="opennotif" style="display:none">🔔<span class="bdg" id="notifBadge" style="display:none">0</span><span class="syncdot idle" id="syncDot"></span></button>
      <div class="pill" id="topPill">🔥 <span id="streakVal">0</span></div>
    </div>
  </div>
  <main id="view"></main>
  <nav class="nav" id="nav">
    <span id="navInd"></span>
    <button class="nb" data-tab="home"><span class="ic">🏠</span>الرئيسية</button>
    <button class="nb" data-tab="plan"><span class="ic">📅</span>البرنامج</button>
    <button class="nb" data-tab="food"><span class="ic">🍽</span>التغذية</button>
    <button class="nb" data-tab="log"><span class="ic">📊</span>السجل</button>
    <button class="nb" data-tab="me"><span class="ic">👤</span>حسابي</button>
  </nav>
</div>
<div id="toast"></div>
<script>
/* ============ CLOUD SYNC (Supabase) ============ */
const SUPABASE_URL='https://iiqjfvdtyzirqkcunmjb.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_YCgaj4BuC6yzWqm_9V14eg_yH99S-OY';
const _wantsCloud = SUPABASE_URL.startsWith('http') && !SUPABASE_ANON_KEY.startsWith('YOUR_');
let CLOUD_ENABLED=false, sb=null;
let sbUser=null, guestMode=false, syncState='idle', authMode='login', authErr='';

// load Supabase SDK dynamically — if it fails or times out, app still works
function loadSupabaseSDK(){
  return new Promise(resolve=>{
    if(!_wantsCloud){resolve(false);return;}
    const timeout=setTimeout(()=>{console.warn('Supabase SDK timeout');resolve(false);},5000);
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    s.onload=()=>{
      clearTimeout(timeout);
      try{
        sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
        CLOUD_ENABLED=true; resolve(true);
      }catch(e){console.error('Supabase init failed:',e);resolve(false);}
    };
    s.onerror=()=>{clearTimeout(timeout);console.warn('Supabase SDK failed to load');resolve(false);};
    document.head.appendChild(s);
  });
}

/* ============ EXERCISE DATABASE ============
fields: id, name, muscle, pattern, equipment, level(1=beg,2=int,3=adv), type(c=compound,i=isolation),
calMin, alts, glute(bool), home(bool) */
const EXERCISES = [

async function load(){
  try{
    if(typeof window.storage!=='undefined'&&window.storage.get){
      const r=await window.storage.get(KEY,false); S=r&&r.value?JSON.parse(r.value):blank();
    }else{
      const raw=localStorage.getItem(KEY); S=raw?JSON.parse(raw):blank();
    }
  }catch(e){S=blank();}
  hydrateState();
}
function hydrateState(){
  // backfill for states saved before the schedule feature existed
  if(!S.weekTasks)S.weekTasks={};
  for(let i=0;i<7;i++){ if(!S.weekTasks[i]) S.weekTasks[i]=[]; }
  if(S.restDaysCustom===undefined)S.restDaysCustom=null;
  if(!S.gymTimePref)S.gymTimePref={};
  if(!S.notifSettings){S.notifSettings=defaultNotifSettings();}
  else{
    const dn=defaultNotifSettings();
    S.notifSettings.gym=S.notifSettings.gym||dn.gym;
    S.notifSettings.meals=S.notifSettings.meals||dn.meals;
    S.notifSettings.meals.categories=S.notifSettings.meals.categories||dn.meals.categories;
    Object.keys(dn.meals.categories).forEach(c=>{ if(!S.notifSettings.meals.categories[c]) S.notifSettings.meals.categories[c]=dn.meals.categories[c]; });
    S.notifSettings.dailyLog=S.notifSettings.dailyLog||dn.dailyLog;
    S.notifSettings.tomorrowPrep=S.notifSettings.tomorrowPrep||dn.tomorrowPrep;
    if(S.notifSettings.enabled===undefined)S.notifSettings.enabled=true;
  }
  if(!S.notifLog)S.notifLog=[];
}
async function save(){
  try{
    if(typeof window.storage!=='undefined'&&window.storage.set){
      await window.storage.set(KEY,JSON.stringify(S),false);
    }else{
      localStorage.setItem(KEY,JSON.stringify(S));
    }
  }catch(e){}
  queueCloudSave();
}
let ttSync;
function queueCloudSave(){
  if(!CLOUD_ENABLED||!sbUser) return;
  syncState='pending';updateSyncBadge();
  clearTimeout(ttSync);
  ttSync=setTimeout(async()=>{
    try{
      await sb.from('app_state').upsert({user_id:sbUser.id,data:S,updated_at:new Date().toISOString()});
      syncState='synced';
    }catch(e){syncState='error';}
    updateSyncBadge();
  },900);
}
async function cloudPull(){
  if(!CLOUD_ENABLED||!sbUser) return false;
  try{
    const {data,error}=await sb.from('app_state').select('data').eq('user_id',sbUser.id).maybeSingle();
    if(error) throw error;
    if(data&&data.data&&Object.keys(data.data).length){ S=data.data; hydrateState(); return true; }
  }catch(e){/* offline or first login — keep local state */}
  return false;
}
function updateSyncBadge(){
  const el=document.getElementById('syncDot'); if(!el) return;
  el.className='syncdot '+syncState;
  el.title=syncState==='synced'?'متزامن ☁️':syncState==='pending'?'بيحفظ...':syncState==='error'?'فشلت المزامنة':'—';
}
async function initCloud(){
  if(!CLOUD_ENABLED) return;
  // Handle email confirmation redirect: Supabase appends tokens to the URL hash
  // or a ?code= param after the user clicks the confirmation link
  try{
    const hash=window.location.hash;
    const params=new URLSearchParams(window.location.search);
    if(hash&&(hash.includes('access_token')||hash.includes('type=signup')||hash.includes('type=recovery'))){
      // v2 implicit flow: tokens in hash
      const {data,error}=await sb.auth.getSession();
      if(!error&&data.session){
        sbUser=data.session.user;
        window.location.hash='';
        toast('تم تأكيد الإيميل ✅ أهلًا بيك!');
        await cloudPull(); await save(); guestMode=false;
        render(); return;
      }
    }
    if(params.get('code')){
      // PKCE flow: code in query string
      const {data,error}=await sb.auth.exchangeCodeForSession(params.get('code'));
      if(!error&&data.session){
        sbUser=data.session.user;
        window.history.replaceState(null,'',window.location.pathname);
        toast('تم تأكيد الإيميل ✅ أهلًا بيك!');
        await cloudPull(); await save(); guestMode=false;
        render(); return;
      }
    }
  }catch(e){ console.warn('auth callback handling:',e); }

  const {data:{session}}=await sb.auth.getSession();
  sbUser=session?session.user:null;
  if(sbUser) await cloudPull();
  sb.auth.onAuthStateChange(async(event,session)=>{
    sbUser=session?session.user:null;
    if(event==='SIGNED_IN'&&sbUser){ await cloudPull(); await save(); guestMode=false; }
    try{ render(); }catch(e){ console.error('Render error (auth change):',e); document.getElementById('view').innerHTML='<div style="padding:40px;text-align:center;color:#fff">حصل خطأ — جرب امسح بيانات الموقع وافتح تاني</div>'; }
  });
}

/* ================= NOTIFICATIONS ================= */
let notifTimers=[];
function clearNotifTimers(){notifTimers.forEach(clearTimeout);notifTimers=[];}

function notifPermission(){ return (typeof Notification!=='undefined')?Notification.permission:'unsupported'; }
async function requestNotifPermission(){
  if(typeof Notification==='undefined'){toast('المتصفح ده مش بيدعم إشعارات النظام — هتوصلك جوه التطبيق بس');return;}
  try{
    const p=await Notification.requestPermission();
    if(p==='granted'){toast('تم تفعيل الإشعارات 🔔');scheduleToday();}
    else if(p==='denied'){toast('اتقفلت الإشعارات من إعدادات المتصفح');}
    render();
  }catch(e){toast('مش قادر أطلب إذن الإشعارات دلوقتي');}
}

function pushSysNotification(title,body){
  try{
    if(typeof Notification!=='undefined'&&Notification.permission==='granted'){
      const n=new Notification(title,{body,tag:title});
      n.onclick=()=>{try{window.focus();}catch(e){}};
    }
  }catch(e){/* ignore — in-app log below still covers it */}
}

function fireNotif(type,title,body,detail){
  const ds=today();
  // avoid duplicate identical alerts firing twice the same day
  const dupe=S.notifLog.find(n=>n.type===type+((detail&&detail.key)?(':'+detail.key):'')&&n.date===ds);
  if(dupe) return;
  const entry={id:uid(),type:type+((detail&&detail.key)?(':'+detail.key):''),kind:type,title,body,date:ds,
    time:new Date().toTimeString().slice(0,5),read:false,detail:detail||null};
  S.notifLog.unshift(entry);
  S.notifLog=S.notifLog.slice(0,80);
  save();
  pushSysNotification(title,body);
  if(document.visibilityState==='visible') toast(title);
  render();
}

function scheduleAtMinutes(mins,cb){
  if(mins==null||isNaN(mins))return;
  const now=new Date();
  const target=new Date(now); target.setHours(0,0,0,0); target.setMinutes(mins);
  const delay=target-now;
  if(delay<=0) return; // already past for today — skip, will run tomorrow's cycle
  const id=setTimeout(cb,delay);
  notifTimers.push(id);
}
function scheduleAtHHMM(hhmm,cb){ scheduleAtMinutes(toMin(hhmm),cb); }

function nextMealForCat(cat){
  const ds=today(), pool=allFoods();
  const loggedIds=new Set(S.foodLogs.filter(l=>l.date===ds).map(l=>l.mealId));
  const alreadyThisCat=S.foodLogs.filter(l=>l.date===ds).some(l=>{const m=pool.find(x=>x.id===l.mealId);return m&&m.cat===cat;});
  if(alreadyThisCat) return null;
  const plan=S.mealPlan&&S.mealPlan.date===ds?S.mealPlan.meals:null;
  if(plan){
    const item=plan.map(x=>pool.find(m=>m.id===x.id)).find(m=>m&&m.cat===cat&&!loggedIds.has(m.id));
    if(item) return item;
  }
  return pool.filter(m=>m.cat===cat)[0]||null;
}
function maybeFireMealNotif(cat){
  const m=nextMealForCat(cat);
  if(!m) return;
  fireNotif('meal',`🍽 حان وقت ${cat}`,`اقتراح: ${m.name} — ${m.kcal} سعرة، ${m.p}جم بروتين`,{key:cat+':'+today(),mealId:m.id,cat});
}

function ingredientsFor(meals){
  const set=new Set();
  meals.forEach(m=>(m.ing||'').split('،').forEach(i=>{const s=i.trim();if(s)set.add(s);}));
  return [...set];
}
function fireTomorrowPrepNotif(){
  const now=new Date(); const tmr=new Date(now); tmr.setDate(tmr.getDate()+1);
  const dsT=dstr(tmr), dowT=tmr.getDay();
  const training=isTrainingDay(dsT);
  const sess=training?sessionFor(dowT):null;
  let title,body,exNames=[];
  if(training&&sess){
    exNames=sess.exercises.map(id=>EX_BY_ID[id]?EX_BY_ID[id].name:null).filter(Boolean);
    title='🏋️ تمرين بكرة: '+sess.name;
    body=exNames.slice(0,4).join('، ')+(exNames.length>4?'…':'');
  }else{
    title='😴 بكرة يوم راحة'; body='مفيش تمرين مجدول — يوم راحة وتعافي';
  }
  let ingList=[],mealNames=[];
  try{
    const tt=targetFor(dsT);
    const preview=generateMealPlan(tt.kcal,tt.protein);
    const pool=allFoods();
    const meals=preview.map(x=>pool.find(m=>m.id===x.id)).filter(Boolean);
    mealNames=meals.map(m=>m.name);
    ingList=ingredientsFor(meals);
  }catch(e){}
  const ingBody=ingList.length?(' — جهّز: '+ingList.slice(0,6).join('، ')+(ingList.length>6?'…':'')):'';
  fireNotif('tomorrow',title,body+ingBody,{key:dsT,exercises:exNames,meals:mealNames,ingredients:ingList,training});
}

function fireDailyLogNotif(){
  const ds=today();
  const hasWorkout=S.workoutLogs.some(l=>l.date===ds);
  const hasFood=S.foodLogs.some(l=>l.date===ds);
  if(hasWorkout&&hasFood) return;
  let body='لسه ما سجلتش ';
  if(!hasWorkout&&!hasFood) body+='تمرين ولا أكل النهارده';
  else if(!hasWorkout) body+='تمرين النهارده';
  else body+='أكل النهارده';
  fireNotif('dailylog','📋 فاكر تسجّل يومك؟',body,{key:ds});
}

function fireGymNotif(){
  const ds=today(), dow=new Date().getDay();
  const pref=S.gymTimePref&&S.gymTimePref[dow];
  const sess=sessionFor(dow);
  if(!pref||pref.start==null) return;
  fireNotif('gym','🏋️ ميعاد الجيم قرّب',
    `معادك الساعة ${fmtHM(pref.start)}${sess?' — '+sess.name:''}`,{key:ds+':'+pref.start});
}

function scheduleToday(){
  clearNotifTimers();
  const ns=S.notifSettings;
  if(!ns||!ns.enabled||!S.profile||!S.program) return;
  const ds=today(), dow=new Date().getDay();

    const pref=S.gymTimePref&&S.gymTimePref[dow];
    if(pref&&pref.start!=null){
      scheduleAtMinutes(pref.start-ns.gym.minsBefore, fireGymNotif);
    }
  }
  if(ns.meals.enabled){
    Object.entries(ns.meals.categories).forEach(([cat,cfg])=>{
      if(cfg.enabled&&cfg.hasTime&&cfg.time) scheduleAtHHMM(cfg.time,()=>maybeFireMealNotif(cat));
    });
  }
  if(ns.dailyLog.enabled
