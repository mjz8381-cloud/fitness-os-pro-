<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fitness OS Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07080b; --elev:#0f1219; --card:#151922; --card2:#1b202b;
    --line:#242b38; --line2:#1a1f29;
    --tx:#f1f4f9; --dim:#98a1b3; --faint:#59617355;
    --faint2:#5c6474;
    --lime:#c9ff57; --violet:#8f7bff; --coral:#ff5d73; --amber:#ffb545; --cyan:#4ee3d0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg)}
  body{font-family:'Cairo',sans-serif;color:var(--tx);display:flex;justify-content:center;min-height:100vh}
  .num{font-family:'Oswald',sans-serif}
  #shell{width:100%;max-width:480px;min-height:100vh;position:relative;overflow:hidden;
    background:var(--bg);
    display:flex;flex-direction:column;border-inline:1px solid var(--line2)}
  #shell>.topbar,#shell>#view,#shell>.nav{position:relative;z-index:1}
  .sky-layer{position:absolute;top:0;left:0;right:0;height:230px;z-index:0;pointer-events:none;transition:background 1.2s ease}
  .sky-decor{position:absolute;inset:0;overflow:hidden}
  .cloud{position:absolute;background:rgba(255,255,255,.25);border-radius:99px;filter:blur(1px);
    animation:driftCloud linear infinite}
  .cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
  .cloud::before{width:60%;height:160%;top:-60%;left:8%}
  .cloud::after{width:45%;height:130%;top:-45%;right:10%}
  .star{position:absolute;background:#fff;border-radius:50%;animation:twinkle ease-in-out infinite}
  .moon{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fdf6d8,#e9dfa0 60%,#cbbf7a);
    box-shadow:0 0 30px 6px rgba(253,246,216,.35)}
  @keyframes driftCloud{from{transform:translateX(-20%)}to{transform:translateX(120%)}}
  @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
  .topbar{position:sticky;top:0;z-index:20;padding:16px 18px 12px;
    background:linear-gradient(180deg,rgba(7,8,11,.75) 0%,rgba(7,8,11,.55) 70%,transparent);
    backdrop-filter:blur(8px) saturate(140%);-webkit-backdrop-filter:blur(8px) saturate(140%);
    display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.04)}
  .logo{font-family:'Oswald',sans-serif;font-weight:700;font-size:19px;display:flex;align-items:center;gap:7px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
  .logo .dot{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime)}
  .sub{font-size:11.5px;color:var(--dim);margin-top:2px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .pill{display:flex;align-items:center;gap:5px;background:rgba(21,25,34,.6);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.08);padding:6px 11px;border-radius:99px;font-size:12.5px;font-weight:700}
  #view{flex:1;padding:2px 18px 108px}
  .st{font-size:12px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;
    margin:20px 2px 9px;display:flex;justify-content:space-between;align-items:center}
  .st .tag{font-size:11px;color:var(--faint2);text-transform:none;letter-spacing:0}
  .card{background:linear-gradient(180deg,rgba(27,32,43,.72),rgba(21,25,34,.55));
    backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
    border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:15px;margin-bottom:11px;
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 14px 30px -22px rgba(0,0,0,.7);
    transition:transform .28s cubic-bezier(.16,1,.3,1),box-shadow .28s;
    animation:cardIn .5s cubic-bezier(.16,1,.3,1) both}
  .card:active{transform:scale(.984)}
  #view>.card:nth-of-type(1),#view>.st:nth-of-type(1)+.card{animation-delay:.02s}
  #view>.card:nth-of-type(2){animation-delay:.06s}
  #view>.card:nth-of-type(3){animation-delay:.1s}
  #view>.card:nth-of-type(4){animation-delay:.14s}
  #view>.card:nth-of-type(5){animation-delay:.18s}
  @keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
  .flush{padding:0;overflow:hidden}
  .row{display:flex;align-items:center;justify-content:space-between}
  .btn{border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:700;border-radius:10px;
    padding:11px 15px;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s}
  .btn:active{transform:scale(.96)}
  .p{background:var(--lime);color:#0c1206}
  .g{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
  .d{background:rgba(255,93,115,.12);color:var(--coral);border:1px solid rgba(255,93,115,.25)}
  .blk{width:100%}
  .sm{padding:7px 11px;font-size:12px;border-radius:8px}
  input,select,textarea{width:100%;background:var(--elev);border:1px solid var(--line);color:var(--tx);
    border-radius:9px;padding:10px 11px;font-family:'Cairo',sans-serif;font-size:13.5px;outline:none}
  input:focus,select:focus{border-color:var(--lime)}
  label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--dim);margin-bottom:10px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
  .chip{font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--card2);
    color:var(--dim);border:1px solid var(--line);display:inline-block}
  .c-lime{background:rgba(201,255,87,.12);color:var(--lime);border-color:rgba(201,255,87,.25)}
  .c-vio{background:rgba(143,123,255,.14);color:var(--violet);border-color:rgba(143,123,255,.3)}
  .c-cor{background:rgba(255,93,115,.12);color:var(--coral);border-color:rgba(255,93,115,.3)}
  .c-amb{background:rgba(255,181,69,.12);color:var(--amber);border-color:rgba(255,181,69,.3)}
  .c-cy{background:rgba(78,227,208,.12);color:var(--cyan);border-color:rgba(78,227,208,.3)}
  .div{height:1px;background:var(--line2);margin:12px 0}
  /* hero ring */
  .hero{display:flex;align-items:center;gap:16px;padding:18px 15px}
  .ringw{position:relative;width:126px;height:126px;flex-shrink:0}
  .ring{width:126px;height:126px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:conic-gradient(var(--lime) calc(var(--pct)*1%),var(--card2) 0);transition:background .9s cubic-bezier(.16,1,.3,1)}
  .ring::before{content:"";position:absolute;inset:10px;background:var(--card);border-radius:50%}
  .ri{position:relative;z-index:2;text-align:center}
  .ri .v{font-size:25px;font-weight:700;line-height:1;font-family:'Oswald',sans-serif}
  .ri .l{font-size:10px;color:var(--faint2);margin-top:3px}
  .hs{flex:1;display:flex;flex-direction:column;gap:8px}
  .hr{display:flex;justify-content:space-between;align-items:baseline}
  .hr .k{font-size:12px;color:var(--dim)}
  .hr .v{font-size:13.5px;font-weight:700}
  .mb{display:flex;flex-direction:column;gap:9px;margin-top:13px}
  .mr{display:flex;align-items:center;gap:9px}
  .ml{width:52px;font-size:11.5px;color:var(--dim);font-weight:700;flex-shrink:0}
  .mt{flex:1;height:7px;background:var(--elev);border-radius:99px;overflow:hidden}
  .mf{height:100%;border-radius:99px;transition:width .8s cubic-bezier(.16,1,.3,1)}
  .mv{width:66px;text-align:left;font-size:10.5px;color:var(--faint2)}
  /* list item */
  .li{display:flex;align-items:center;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--line2);gap:10px}
  .li:last-child{border-bottom:none}
  .li .n{font-weight:700;font-size:13.8px}
  .li .m{font-size:11px;color:var(--faint2);margin-top:3px;line-height:1.5}
  .ib{width:33px;height:33px;border-radius:9px;background:var(--card2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--tx);cursor:pointer;font-size:14px;flex-shrink:0}
  .ib:active{transform:scale(.92)}
  .empty{text-align:center;padding:26px 14px;color:var(--faint2);font-size:13px}
  .empty .b{font-size:28px;margin-bottom:6px}
  /* onboarding */
  .ob{padding:8px 0}
  .ob h1{font-family:'Oswald',sans-serif;font-size:26px;margin:6px 0 4px;font-weight:700}
  .ob p.lead{color:var(--dim);font-size:13px;line-height:1.7;margin:0 0 18px}
  .steps{display:flex;gap:5px;margin-bottom:20px}
  .sdot{flex:1;height:3px;border-radius:9px;background:var(--card2)}
  .sdot.on{background:var(--lime)}
  .opt{display:block;width:100%;text-align:right;background:var(--card);border:1.5px solid var(--line2);
    border-radius:13px;padding:14px;margin-bottom:9px;cursor:pointer;color:var(--tx);font-family:'Cairo',sans-serif}
  .opt:active{transform:scale(.985)}
  .opt.sel{border-color:var(--lime);background:rgba(201,255,87,.06)}
  .opt .t{font-weight:700;font-size:14.5px}
  .opt .d2{font-size:11.5px;color:var(--faint2);margin-top:4px;line-height:1.6}
  .q{font-size:16px;font-weight:700;margin:0 0 13px}
  /* week strip */
  .ws{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
  .ws::-webkit-scrollbar{display:none}
  .dc{flex-shrink:0;width:66px;padding:11px 0 9px;border-radius:14px;text-align:center;
    background:var(--card);border:1px solid var(--line2);cursor:pointer}
  .dc.act{background:var(--lime);border-color:var(--lime)}
  .dc.act .dn,.dc.act .dd{color:#0c1206}
  .dc .dn{font-size:12px;font-weight:700}
  .dc .dd{font-size:9.5px;color:var(--faint2);margin-top:5px;padding:0 3px;line-height:1.3}
  .dc.tdy{box-shadow:0 0 0 2px var(--lime) inset}
  .dc.tdy.act{box-shadow:none}
  /* set logger */
  .setrow{display:flex;gap:7px;align-items:center;margin-bottom:7px}
  .setrow .sn{width:26px;font-size:11px;color:var(--faint2);font-weight:700;flex-shrink:0}
  .setrow input{padding:8px;text-align:center;font-size:13px}
  .setrow .u{font-size:10.5px;color:var(--faint2);width:22px;flex-shrink:0}
  /* nav */
  .nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
    background:rgba(15,18,25,.85);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);
    border-top:1px solid rgba(255,255,255,.06);
    display:flex;padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:30}
  .nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;
    color:var(--faint2);font-family:'Cairo',sans-serif;padding:6px 0;cursor:pointer;font-size:10px;font-weight:700}
  .nb .ic{font-size:18px;line-height:1}
  .nb.on{color:var(--lime)}
  #toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(18px);background:var(--tx);
    color:#0c1206;font-weight:700;font-size:13px;padding:10px 18px;border-radius:99px;opacity:0;
    pointer-events:none;transition:all .3s cubic-bezier(.16,1,.3,1);z-index:100;white-space:nowrap;max-width:88%}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  select option{background:var(--elev)}
  ::-webkit-scrollbar{width:0;height:0}
  .tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
  .tb{flex-shrink:0;padding:7px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line2);
    font-size:12px;font-weight:700;color:var(--dim);cursor:pointer;font-family:'Cairo',sans-serif}
  .tb.on{background:var(--lime);color:#0c1206;border-color:var(--lime)}
  /* notifications */
  .bell{position:relative;background:rgba(21,25,34,.6);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);color:var(--tx);
    width:36px;height:36px;border-radius:99px;display:flex;align-items:center;justify-content:center;
    font-size:16px;cursor:pointer;transition:transform .2s}
  .bell:active{transform:scale(.94)}
  .bdg{position:absolute;top:-3px;left:-3px;background:var(--coral);color:#fff;font-size:9.5px;font-weight:800;
    min-width:16px;height:16px;border-radius:99px;display:flex;align-items:center;justify-content:center;
    padding:0 3px;border:2px solid var(--bg);font-family:'Oswald',sans-serif}
  .syncdot{position:absolute;bottom:-1px;right:-1px;width:10px;height:10px;border-radius:50%;
    border:2px solid var(--bg);display:none}
  .syncdot.pending{display:block;background:var(--amber);animation:pulseDot 1s ease-in-out infinite}
  .syncdot.synced{display:block;background:var(--lime)}
  .syncdot.error{display:block;background:var(--coral)}
  @keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}
  .toprow{display:flex;align-items:center;gap:8px}
  .swrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 2px}
  .swrow .tt{font-size:13.5px;font-weight:700}
  .swrow .dd{font-size:11px;color:var(--faint2);margin-top:2px;line-height:1.6}
  .sw{position:relative;width:42px;height:24px;border-radius:99px;background:var(--card2);border:1px solid var(--line);
    cursor:pointer;flex-shrink:0;transition:background .15s}
  .sw.on{background:var(--lime);border-color:var(--lime)}
  .sw::after{content:"";position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:#fff;
    transition:transform .15s}
  .sw.on::after{transform:translateX(-18px)}
  .nrow{display:flex;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line2)}
  .nrow:last-child{border-bottom:none}
  .nrow .ic2{width:34px;height:34px;border-radius:9px;background:var(--card2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
  .nrow .nt{font-weight:700;font-size:13px}
  .nrow .nb2{font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.6}
  .nrow .nm{font-size:10px;color:var(--faint2);margin-top:4px}
  .nrow.unread{background:rgba(201,255,87,.04)}
  .permbox{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--elev);
    border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:12px}

  /* ---------- lock / paywall overlay ---------- */
  .lockwrap{position:relative;min-height:60vh}
  .lockblur{filter:blur(7px) saturate(60%);opacity:.55;pointer-events:none;user-select:none;
    max-height:78vh;overflow:hidden}
  .lockcard{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:88%;max-width:340px;
    background:linear-gradient(180deg,rgba(27,32,43,.97),rgba(21,25,34,.97));
    border:1.5px solid rgba(201,255,87,.35);border-radius:18px;padding:24px 20px;text-align:center;
    box-shadow:0 20px 60px -20px rgba(0,0,0,.8);z-index:5}

  /* ---------- AI coach chat ---------- */
  .chatlog{display:flex;flex-direction:column;gap:10px;padding:6px 2px 14px}
  .msg{max-width:82%;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.7;white-space:pre-wrap}
  .msg.me{align-self:flex-end;background:var(--lime);color:#0c1206;border-bottom-left-radius:4px}
  .msg.ai{background:linear-gradient(180deg,#171c26,#12151d);border:1px solid rgba(201,255,87,.18);border-bottom-right-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .aiinputwrap{flex:1;display:flex;align-items:center;gap:8px;background:var(--elev);border:1px solid var(--line);border-radius:12px;padding:0 12px}
  .aiinputwrap .aiico{font-size:15px;flex-shrink:0;opacity:.8}
  .aiinputwrap input{background:transparent;border:none;padding:11px 0}
  .aiinputwrap input:focus{border:none;outline:none}
  /* ---------- daily lock-screen style popup ---------- */
  .dpop-bg{position:fixed;inset:0;background:rgba(4,5,8,.6);backdrop-filter:blur(6px);z-index:200;
    display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .35s ease;padding:24px}
  .dpop-bg.on{opacity:1}
  .dpop-card{width:100%;max-width:320px;background:linear-gradient(180deg,rgba(23,28,38,.96),rgba(15,18,25,.98));
    border:1px solid rgba(201,255,87,.25);border-radius:22px;padding:20px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);
    transform:translateY(14px) scale(.97);transition:transform .35s cubic-bezier(.16,1,.3,1);text-align:center}
  .dpop-bg.on .dpop-card{transform:translateY(0) scale(1)}
  .dpop-icon{width:52px;height:52px;border-radius:50%;background:linear-gradient(155deg,var(--lime),#8fd12f);
    display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 12px;box-shadow:0 6px 18px rgba(201,255,87,.3)}
  .dpop-time{font-size:11px;color:var(--faint2);margin-bottom:6px;font-family:'Oswald',sans-serif;letter-spacing:.04em}
  .dpop-text{font-size:13.5px;line-height:1.8;color:var(--tx);margin-bottom:16px}
  .chatinputrow{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));display:flex;gap:8px;
    padding:8px 0;background:linear-gradient(0deg,var(--bg) 60%,transparent)}
  .chatinputrow input{flex:1}
  .creditbar{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--faint2);
    padding:0 2px;margin-bottom:8px}

  /* ---------- admin panel ---------- */
  .adminrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 4px}

  /* ---------- motion / glass / ripple / skeleton ---------- */
  .btn,.nb,.ib,.opt,.bell,.tb{position:relative;overflow:hidden}
  .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);
    transform:scale(0);pointer-events:none;animation:rippleAnim .55s ease-out forwards}
  .p .ripple{background:rgba(12,18,6,.35)}
  .tb.on .ripple{background:rgba(12,18,6,.3)}
  @keyframes rippleAnim{to{transform:scale(1);opacity:0}}

  #view{animation:none}
  #view.page-enter{animation:pageIn .42s cubic-bezier(.16,1,.3,1)}
  @keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

  .nav{transition:background .2s}
  .nb{transition:color .25s}
  .nb .ic{transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
  .nb.on .ic{transform:translateY(-2px) scale(1.12)}
  #navInd{position:absolute;bottom:6px;height:3px;width:22px;border-radius:99px;background:var(--lime);
    box-shadow:0 0 8px var(--lime);transition:left .32s cubic-bezier(.34,1.56,.64,1);pointer-events:none}

  .ring{transition:background 1.1s cubic-bezier(.16,1,.3,1)}
  .mf{transition:width 1s cubic-bezier(.16,1,.3,1)}

  .skel{background:linear-gradient(100deg,var(--card) 30%,var(--card2) 45%,var(--card) 60%);
    background-size:250% 100%;animation:shimmer 1.5s ease-in-out infinite;border-radius:9px}
  @keyframes shimmer{0%{background-position:180% 0}100%{background-position:-80% 0}}
  .skel-hero{display:flex;align-items:center;gap:16px;padding:18px 15px}
  .skel-ring{width:126px;height:126px;border-radius:50%;flex-shrink:0}
  .skel-lines{flex:1;display:flex;flex-direction:column;gap:10px}
  .skel-ln{height:11px;border-radius:6px}
  .skel-row{display:flex;align-items:center;gap:10px;padding:11px 4px}
  .skel-sq{width:40px;height:40px;border-radius:10px;flex-shrink:0}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
      transition-duration:.001ms!important;scroll-behavior:auto!important}
  }

  /* progress engine rings */
  .tt{font-size:13.5px;font-weight:700}
  .dd{font-size:11px;color:var(--faint2);margin-top:2px;line-height:1.6}
  .mrings{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 2px}
  .mringbtn{background:none;border:none;padding:6px 2px;cursor:pointer;font-family:'Cairo',sans-serif;
    border-radius:12px;transition:background .2s,transform .2s;display:block;width:100%}
  .mringbtn:active{transform:scale(.94)}
  .mringbtn.sel{background:rgba(255,255,255,.05)}
  .mring{position:relative;width:100%;aspect-ratio:1;border-radius:50%;
    display:flex;align-items:center;justify-content:center}

function trialActive(){
  if(!sbTrialStart) return false;
  const started=new Date(sbTrialStart);
  const diffDays=(Date.now()-started.getTime())/86400000;
  return diffDays<TRIAL_DAYS;
}
function trialDaysLeft(){
  if(!sbTrialStart) return 0;
  const started=new Date(sbTrialStart);
  const diffDays=(Date.now()-started.getTime())/86400000;
  return Math.max(0,+(TRIAL_DAYS-diffDays).toFixed(2));
}
// بيرجع الوقت المتبقي من التجربة كـ {h,m,s,totalMs} — مستخدمة في العداد التنازلي الحي
function trialRemaining(){
  if(!sbTrialStart) return {h:0,m:0,s:0,totalMs:0};
  const started=new Date(sbTrialStart).getTime();
  const endMs=started+TRIAL_DAYS*86400000;
  const totalMs=Math.max(0,endMs-Date.now());
  const h=Math.floor(totalMs/3600000);
  const m=Math.floor((totalMs%3600000)/60000);
  const s=Math.floor((totalMs%60000)/1000);
  return {h,m,s,totalMs};
}
// isPro: هل المستخدم عنده وصول كامل للتطبيق؟ (اشتراك حقيقي، أو تجربة سارية، أو الأدمن فاتح كل حاجة يدويًا)
function isPro(){
  if(!CLOUD_ENABLED||!sbUser) return false;
  if(sbIsAdmin) return true; // الأدمن دايمًا عنده وصول كامل لنفسه
  if(sbLockOverride===false) return true; // الأدمن فاتح كل حاجة لكل المستخدمين
  if(sbLockOverride===true) return false; // الأدمن قافل كل حاجة لكل المستخدمين (حتى التجربة)
  return sbIsPro || trialActive();
}

async function load(){
  try{
    if(typeof window.storage!=='undefined'&&window.storage.get){
      const r=await window.storage.get(KEY,false); S=r&&r.value?JSON.parse(r.value):blank();
    }else{
      const raw=localStorage.getItem(KEY); S=raw?JSON.parse(raw):blank();
    }
  }catch(e){S=blank();}
  hydrateState();
}
function hydrateState(){
  // backfill for states saved before the schedule feature existed
  if(!S.weekTasks)S.weekTasks={};
  for(let i=0;i<7;i++){ if(!S.weekTasks[i]) S.weekTasks[i]=[]; }
  if(S.restDaysCustom===undefined)S.restDaysCustom=null;
  if(!S.gymTimePref)S.gymTimePref={};
  if(!S.notifSettings){S.notifSettings=defaultNotifSettings();}
  else{
    const dn=defaultNotifSettings();
    S.notifSettings.gym=S.notifSettings.gym||dn.gym;
    S.notifSettings.meals=S.notifSettings.meals||dn.meals;
    S.notifSettings.meals.categories=S.notifSettings.meals.categories||dn.meals.categories;
    Object.keys(dn.meals.categories).forEach(c=>{ if(!S.notifSettings.meals.categories[c]) S.notifSettings.meals.categories[c]=dn.meals.categories[c]; });
    S.notifSettings.dailyLog=S.notifSettings.dailyLog||dn.dailyLog;
    S.notifSettings.tomorrowPrep=S.notifSettings.tomorrowPrep||dn.tomorrowPrep;
    if(S.notifSettings.enabled===undefined)S.notifSettings.enabled=true;
  }
  if(!S.notifLog)S.notifLog=[];
  if(!S.aiChat)S.aiChat=[];
}
async function save(){
  try{
    if(typeof window.storage!=='undefined'&&window.storage.set){
      await window.storage.set(KEY,JSON.stringify(S),false);
    }else{
      localStorage.setItem(KEY,JSON.stringify(S));
    }
  }catch(e){}
  queueCloudSave();
}
let ttSync;
function queueCloudSave(){
  if(!CLOUD_ENABLED||!sbUser) return;
  syncState='pending';updateSyncBadge();
  clearTimeout(ttSync);
  ttSync=setTimeout(async()=>{
    try{
      // upsert بيبعت data وupdated_at بس — عمود is_pro مش موجود هنا خالص
      // فـ upsert بيسيبه زي ما هو محفوظ في الداتابيز (default false أو true لو اتفعّل يدويًا)
      await sb.from('app_state').upsert({user_id:sbUser.id,data:S,updated_at:new Date().toISOString()},{onConflict:'user_id',ignoreDuplicates:false});
      syncState='synced';
    }catch(e){syncState='error';}
    updateSyncBadge();
  },900);
}
async function cloudPull(){
  if(!CLOUD_ENABLED||!sbUser) return false;
  try{
    const {data,error}=await sb.from('app_state')
      .select('data,is_pro,is_admin,trial_started_at')
      .eq('user_id',sbUser.id).maybeSingle();
    if(error) throw error;
    if(data){
      sbIsPro=!!data.is_pro;
      sbIsAdmin=!!data.is_admin;
      sbTrialStart=data.trial_started_at||null;
      if(data.data&&Object.keys(data.data).length){ S=data.data; hydrateState(); }
      await ensureTrialStarted();
      await refreshAiCreditsFromServer();
      return true;
    }
  }catch(e){/* offline or first login — keep local state */}
  return false;
}
// أول ما يسجل المستخدم دخول لأول مرة، لو التجربة لسه ما بدأتش، تتسجل تلقائيًا من هنا
async function ensureTrialStarted(){
  if(!CLOUD_ENABLED||!sbUser||sbTrialStart) return;
  try{
    sbTrialStart=new Date().toISOString();
    await sb.from('app_state').update({trial_started_at:sbTrialStart}).eq('user_id',sbUser.id);

async function initCloud(){
  if(!CLOUD_ENABLED) return;
  await pullAppSettings();
  // Handle email confirmation redirect: Supabase appends tokens to the URL hash
  // or a ?code= param after the user clicks the confirmation link
  try{
    const hash=window.location.hash;
    const params=new URLSearchParams(window.location.search);
    if(hash&&(hash.includes('access_token')||hash.includes('type=signup')||hash.includes('type=recovery'))){
      // v2 implicit flow: tokens in hash
      const {data,error}=await sb.auth.getSession();
      if(!error&&data.session){
        sbUser=data.session.user;
        window.location.hash='';
        toast('تم تأكيد الإيميل ✅ أهلًا بيك!');
        await cloudPull(); await save(); guestMode=false;
        render(); return;
      }
    }
    if(params.get('code')){
      // PKCE flow: code in query string
      const {data,error}=await sb.auth.exchangeCodeForSession(params.get('code'));
      if(!error&&data.session){
        sbUser=data.session.user;
        window.history.replaceState(null,'',window.location.pathname);
        toast('تم تأكيد الإيميل ✅ أهلًا بيك!');
        await cloudPull(); await save(); guestMode=false;
        render(); return;
      }
    }
  }catch(e){ console.warn('auth callback handling:',e); }

  const {data:{session}}=await sb.auth.getSession();
  sbUser=session?session.user:null;
  if(sbUser) await cloudPull();
  sb.auth.onAuthStateChange(async(event,session)=>{
    sbUser=session?session.user:null;
    if(event==='SIGNED_IN'&&sbUser){ await cloudPull(); await save(); guestMode=false; }
    render();
  });
}

/* ---------- Push حقيقي عن طريق service worker (بيشتغل حتى والتطبيق مقفول) ---------- */
function urlBase64ToUint8Array(base64String){
  const padding='='.repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(base64);
  const arr=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i);
  return arr;
}
async function registerServiceWorker(){
  if(!('serviceWorker' in navigator)){ console.warn('[sw] serviceWorker not supported in this browser'); return null; }
  try{
    const reg=await navigator.serviceWorker.register('/sw.js');
    console.log('[sw] registered OK, scope:',reg.scope);
    return reg;
  }catch(e){
    // لو ده ظهر، ده معناه إن ملف /sw.js مش موجود أو مش متعمله deploy على السيرفر —
    // افتح https://YOUR-DOMAIN/sw.js في المتصفح مباشرة، المفروض تشوف كود جافاسكريبت مش صفحة 404
    console.error('[sw] register FAILED — check that /sw.js is deployed at your site root:',e);
    return null;
  }
}
async function ensurePushSubscription(){
  if(!CLOUD_ENABLED||!sb||!sbUser) return;
  if(!('serviceWorker' in navigator)||!('PushManager' in window)) return;
  if(typeof Notification==='undefined'||Notification.permission!=='granted') return;
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub){
      sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)});
    }
    const j=sub.toJSON();
    if(!j.endpoint||!j.keys) return;
    await sb.from('push_subscriptions').upsert({
      user_id:sbUser.id, endpoint:j.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth
    },{onConflict:'endpoint'});
  }catch(e){ console.error('push subscribe failed',e); }
}

  if(alreadyThisCat) return null;
  const plan=S.mealPlan&&S.mealPlan.date===ds?S.mealPlan.meals:null;

function scheduleToday(){
  clearNotifTimers();
  const ns=S.notifSettings;
  if(!ns||!ns.enabled||!S.profile||!S.program) return;
  const ds=today(), dow=new Date().getDay();

  if(ns.gym.enabled&&isTrainingDay(ds)){
    const pref=S.gymTimePref&&S.gymTimePref[dow];
    if(pref&&pref.start!=null){
      const mins=pref.start-ns.gym.minsBefore;
      scheduleAtMinutes(mins,fireGymNotif);
      const b=buildGymNotif(); if(b) queueServerNotif('gym:'+b.key,b.title,b.body,targetDateForMinutes(mins));
    }
  }
  if(ns.meals.enabled){
    Object.entries(ns.meals.categories).forEach(([cat,cfg])=>{
      if(cfg.enabled&&cfg.hasTime&&cfg.time){
        scheduleAtHHMM(cfg.time,()=>maybeFireMealNotif(cat));
        const b=buildMealNotif(cat); if(b) queueServerNotif('meal:'+b.key,b.title,b.body,targetDateForMinutes(toMin(cfg.time)));
      }
    });
  }
  if(ns.dailyLog.enabled){
    scheduleAtHHMM(ns.dailyLog.time,fireDailyLogNotif);
    const b=buildDailyLogNotif(); if(b) queueServerNotif('dailylog:'+b.key,b.title,b.body,targetDateForMinutes(toMin(ns.dailyLog.time)));
  }
  if(ns.tomorrowPrep.enabled){

    const b=buildTomorrowPrepNotif(); queueServerNotif('tomorrow:'+b.key,b.title,b.body,targetDateForMinutes(toMin(ns.tomorrowPrep.time)));
  }

  // re-run the whole scheduler right after midnight for the new day
  const now=new Date(); const midnight=new Date(now); midnight.setHours(24,0,10,0);
  const id=setTimeout(()=>{scheduleToday();},midnight-now);
  notifTimers.push(id);

/* ================= TDEE + MACROS ================= */
function calcBMR(p){
  let b=10*p.weight+6.25*p.height-5*p.age;
  return Math.round(b+(p.gender==='male'?5:-161));
}
function calcTDEE(p){ return Math.round(calcBMR(p)*(ACT[p.activity]||ACT.moderate).m); }

function macroTargets(){
  const p=S.profile, g=GOALS[p.goal];
  const tdee=calcTDEE(p);
  const kcal=Math.round(tdee*(1+g.kcalAdj));
  const protein=Math.round(p.weight*g.proteinPerKg);
  const fat=Math.round(p.weight*g.fatPerKg);
  const carbs=Math.max(50,Math.round((kcal-protein*4-fat*9)/4));
  return {tdee,kcal,protein,fat,carbs};
}
// training days get a small carb/calorie bump, rest days a small cut (calorie shifting)
function targetFor(dateStr){
  const t=macroTargets();
  const isTrain=isTrainingDay(dateStr);
  const shift=Math.round(t.kcal*0.06);
  const kcal=isTrain?t.kcal+shift:t.kcal-shift;
  const carbs=Math.max(40,Math.round((kcal-t.protein*4-t.fat*9)/4));
  return {...t,kcal,carbs,isTrain};
}
function isTrainingDay(dateStr){
  if(!S.program) return false;
  const idx=new Date(dateStr+'T00:00:00').getDay();
  const d=S.program.week.find(x=>x.dow===idx);
  return !!(d&&!d.rest);
}

/* ================= PROGRAM GENERATOR ================= */
// variant lets a repeated session (e.g. Pull A vs Pull B) select different exercises
function pickExercises(groups, lvl, gender, goal, equipAtHome, variant){
  variant=variant||0;
  const maxL=LEVELS[lvl].maxLevel, want=LEVELS[lvl].exCount;
  const out=[];
  const pool=g=>EXERCISES.filter(e=>e.muscle===g&&e.level<=maxL&&(!equipAtHome||e.home));
  const rot=(arr,n)=>arr.length?arr.slice(n%arr.length).concat(arr.slice(0,n%arr.length)):arr;
  const glutePref=(arr,g)=>(gender==='female'&&(g==='أرجل'||g==='ظهر'))
    ? [...arr].sort((a,b)=>(b.glute?1:0)-(a.glute?1:0)) : arr;

  // compounds first — 2 for the primary group when the session covers few groups
  groups.forEach((g,gi)=>{
    const c=rot(glutePref(pool(g).filter(e=>e.type==='c'),g),variant+gi);
    const need=(groups.length<=2&&gi===0)?2:1;
    let added=0;
    for(const e of c){ if(added>=need)break; if(!out.includes(e.id)){out.push(e.id);added++;} }
  });
  // then isolations, rotating across groups
  let i=0;
  while(out.length<want && i<50){
    const g=groups[i%groups.length];
    const iso=rot(glutePref(pool(g).filter(e=>e.type==='i'&&!out.includes(e.id)),g),variant);
    if(iso.length) out.push(iso[0].id);
    else{
      const any=rot(pool(g).filter(e=>!out.includes(e.id)),variant)[0];
      if(any) out.push(any.id);
    }
    i++;
  }
  let list=out.slice(0,want);
  // trim until the session fits inside 48 minutes
  while(list.length>4 && estimateMinutes(list,goal)>48) list=list.slice(0,list.length-1);
  // cut / recomp → cardio finisher only if there's room left in the budget
  if(GOALS[goal].cardio){
    const cd=EXERCISES.filter(e=>e.pattern==='cardio'&&(!equipAtHome||e.home));
    if(cd.length&&estimateMinutes(list.concat(cd[variant%cd.length].id),goal)<=48)
      list.push(cd[variant%cd.length].id);
  }
  return list;
}

function estimateMinutes(exIds, goal){
  const g=GOALS[goal];
  let sec=240; // warm-up
  exIds.forEach(id=>{
    const e=EX_BY_ID[id]; if(!e)return;
    if(e.pattern==='cardio'){ sec+=420; return; }
    const sets=e.type==='c'?g.sets:Math.max(2,g.sets-1);
    sec+=sets*(30+g.rest);
  });
  return Math.round(sec/60);
}

function buildProgram(p, customRestDays){
  const split=SPLITS[p.split];
  const order=[6,0,1,2,3,4,5]; // start Saturday
  const week=[];

  // customRestDays (array of dow ints, 0=Sunday..6=Saturday) lets the user pick
  // their own rest days (e.g. based on their weekly task load) instead of the
  // automatic even-spread pattern.
  let trainDows;
  if(customRestDays){
    trainDows=order.filter(dow=>!customRestDays.includes(dow));
  } else {
    const trainSlots=distribute(p.daysPerWeek);
    trainDows=order.filter((dow,pos)=>trainSlots.includes(pos));
  }

  const n=trainDows.length;
  // default path: identical slice behaviour to before. custom path: cycle
  // through the split's sessions so any day-count works.
  const sessions=customRestDays
    ? Array.from({length:n},(_,i)=>split.sessions[i%split.sessions.length])
    : split.sessions.slice(0,n);

  let si=0;
  order.forEach(dow=>{
    if(trainDows.includes(dow)&&si<sessions.length){
      const s=sessions[si];
      const variant=sessions.slice(0,si).filter(x=>x.groups.join()===s.groups.join()).length
                  + (si>2?1:0);
      const ex=pickExercises(s.groups,p.level,p.gender,p.goal,p.location==='home',variant);
      week.push({dow,rest:false,name:s.name,groups:s.groups,exercises:ex,minutes:estimateMinutes(ex,p.goal)});
      si++;
    } else week.push({dow,rest:true,name:'راحة',groups:[],exercises:[],minutes:0});
  });
  week.sort((a,b)=>a.dow-b.dow);
  return {split:p.split,createdAt:today(),week};
}
function currentRestDays(){
  if(S.restDaysCustom) return S.restDaysCustom.slice();
  return S.program?S.program.week.filter(d=>d.rest).map(d=>d.dow):[];
}

/* ================= WEEKLY SCHEDULE / GYM-TIME FINDER ================= */
const DAY_WINDOW_START=6*60, DAY_WINDOW_END=23*60; // 06:00 - 23:00
const BUCKETS=[
  {key:'morning', label:'صباحًا', icon:'🌅', start:6*60,  end:11*60},
  {key:'midday',  label:'الضهر',  icon:'☀️', start:11*60, end:16*60},
  {key:'evening', label:'مساءً',  icon:'🌙', start:16*60, end:22*60}
];
function toMin(hhmm){ if(!hhmm)return null; const [h,m]=hhmm.split(':').map(Number); return h*60+(m||0); }
function fmtHM(m){ m=Math.max(0,Math.round(m)); const h=Math.floor(m/60), mm=m%60; return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0'); }
function tasksFor(dow){ return (S.weekTasks[dow]||[]).slice().sort((a,b)=>toMin(a.start)-toMin(b.start)); }

// returns each of the 3 day buckets with whether a big-enough free gap exists in it
function bucketAvailability(dow, neededMinutes){
  const tasks=tasksFor(dow);
  return BUCKETS.map(b=>{
    const relevant=tasks.filter(t=>toMin(t.end)>b.start && toMin(t.start)<b.end);
    let cur=b.start, segments=[];
    relevant.forEach(t=>{
      const s=Math.max(b.start,toMin(t.start)), e=Math.min(b.end,toMin(t.end));
      if(s>cur) segments.push([cur,s]);
      cur=Math.max(cur,e);
    });
    if(cur<b.end) segments.push([cur,b.end]);
    const fit=segments.filter(([s,e])=>e-s>=neededMinutes);
    fit.sort((x,y)=>(y[1]-y[0])-(x[1]-x[0]));
    const slot=fit[0]||null;
    return {...b, free:!!slot, slotStart:slot?slot[0]:null, slotEnd:slot?Math.min(slot[1],(slot[0]+neededMinutes)):null};
  });
}
function distribute(n){
  const map={2:[0,3],3:[0,2,4],4:[0,1,3,4],5:[0,1,2,4,5],6:[0,1,2,3,4,5]};
  return map[n]||map[4];
}

/* ================= MEAL PLAN GENERATOR ================= */
function allFoods(){return MEALS.concat(S.customFoods||[]);}
// returns [{id, qty}] — portions scale so high-calorie targets are actually reachable
function generateMealPlan(targetKcal,targetProtein){
  const pool=allFoods();
  const byCat=c=>pool.filter(m=>m.cat===c);
  const QTY=[0.75,1,1.25,1.5,1.75,2];
  let best=null;
  for(let iter=0;iter<600;iter++){
    let picks=[rand(byCat('فطار')),rand(byCat('غدا')),rand(byCat('عشا')),rand(byCat('سناك'))]
      .filter(Boolean).map(m=>({m,q:1}));
    // add snacks while still well short of target
    let guard=0;
    while(sumK(picks)<targetKcal-260 && guard<3){
      const s=rand(byCat('سناك')); if(!s)break; picks.push({m:s,q:1}); guard++;
    }
    // greedily tune portion sizes on the main meals
    for(let pass=0;pass<3;pass++){
      picks.forEach(p=>{
        let bq=p.q, bs=score(picks,targetKcal,targetProtein);
        QTY.forEach(q=>{
          const old=p.q; p.q=q;
          const s=score(picks,targetKcal,targetProtein);
          if(s<bs){bs=s;bq=q;}
          p.q=old;
        });
        p.q=bq;
      });
    }
    const sc=score(picks,targetKcal,targetProtein);
    if(!best||sc<best.sc) best={sc,meals:picks.map(p=>({id:p.m.id,qty:p.q}))};
  }
  return best?best.meals:[];
}
function sumK(a){return a.reduce((s,p)=>s+p.m.kcal*p.q,0);}
function score(a,tk,tp){
  const k=a.reduce((s,p)=>s+p.m.kcal*p.q,0);
  const pr=a.reduce((s,p)=>s+p.m.p*p.q,0);
  // protein shortfall is penalised much harder than protein excess
  const pPen=pr<tp?(tp-pr)*9:(pr-tp)*2;
  return Math.abs(k-tk)+pPen;
}
function rand(a){return a.length?a[Math.floor(Math.random()*a.length)]:null;}

/* ================= COMPUTED ================= */
function foodTotals(ds){
  const pool=allFoods();
  let k=0,p=0,c=0,f=0;
  S.foodLogs.filter(l=>l.date===ds).forEach(l=>{
    const m=pool.find(x=>x.id===l.mealId); if(!m)return;
    k+=m.kcal*l.qty;p+=m.p*l.qty;c+=m.c*l.qty;f+=m.f*l.qty;
  });
  return {k:Math.round(k),p:Math.round(p),c:Math.round(c),f:Math.round(f)};
}
function burnedOn(ds){
  let s=0;
  S.workoutLogs.filter(l=>l.date===ds).forEach(l=>{
    const e=EX_BY_ID[l.exerciseId]; if(e) s+=(e.calMin||0)*(l.minutes||0);
  });
  return Math.round(s);
}
function streak(){
  let n=0,d=new Date();
  for(let i=0;i<400;i++){
    const ds=dstr(d);
    const done=S.workoutLogs.some(l=>l.date===ds)||S.foodLogs.some(l=>l.date===ds);
    const rest=!isTrainingDay(ds);
    if(done){n++;d.setDate(d.getDate()-1);}
    else if(rest&&i>0){d.setDate(d.getDate()-1);} // rest days don't break the streak
    else break;
  }
  return n;
}
function sessionFor(dow){ return S.program?S.program.week.find(d=>d.dow===dow):null; }
function bestSet(exId){
  const logs=S.workoutLogs.filter(l=>l.exerciseId===exId&&l.weight);
  if(!logs.length) return null;
  return logs.reduce((a,b)=>b.weight>a.weight?b:a);
}
function lastSession(exId){
  const logs=S.workoutLogs.filter(l=>l.exerciseId===exId&&l.date!==today()).sort((a,b)=>b.date.localeCompare(a.date));
  return logs[0]||null;
}

/* ================= PROGRESS ENGINE ================= */
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function periodDates(period){
  const end=new Date(); end.setHours(0,0,0,0);
  const len=period==='day'?1:period==='week'?7:30;
  const start=new Date(end); start.setDate(end.getDate()-(len-1));
  const days=[]; let d=new Date(start);
  while(d<=end){days.push(dstr(d));d.setDate(d.getDate()+1);}
  return {start,end,days,len};
}

/* --- 1) التمرين: تمارين اتسجلت فعليًا ÷ تمارين مفروضة، + سعرات محروقة في الفترة --- */
function computeTraining(days){
  const trainDays=days.filter(ds=>isTrainingDay(ds));
  let plannedEx=0, doneEx=0, burned=0;
  days.forEach(ds=>{
    burned+=burnedOn(ds);
    if(!isTrainingDay(ds)) return;
    const dow=new Date(ds+'T00:00:00').getDay();
    const sess=sessionFor(dow);
    if(!sess||sess.rest) return;
    plannedEx+=sess.exercises.length;
    doneEx+=sess.exercises.filter(id=>S.workoutLogs.some(l=>l.date===ds&&l.exerciseId===id)).length;
  });
  const score=plannedEx?Math.round(clamp(doneEx/plannedEx*100,0,100)):0;
  return {score,doneEx,plannedEx,trainDays:trainDays.length,burned:Math.round(burned)};
}

/* --- 2) التغذية: % من هدف السعرات المحقق، + إجمالي كالوري/بروتين/كارب/دهون فعلي --- */
function computeNutrition(days){
  let kcalSum=0,proteinSum=0,carbSum=0,fatSum=0,targetKcalSum=0,loggedDays=0,mealCount=0;
  const daySet=new Set(days);
  mealCount=S.foodLogs.filter(l=>daySet.has(l.date)).length;
  days.forEach(ds=>{
    const t=targetFor(ds), tot=foodTotals(ds);
    targetKcalSum+=t.kcal;
    if(!S.foodLogs.some(l=>l.date===ds)) return;
    loggedDays++;
    kcalSum+=tot.k;proteinSum+=tot.p;carbSum+=tot.c;fatSum+=tot.f;
  });
  // score = من إجمالي هدف السعرات في الفترة، قد إيه فعليًا حققت (متغطاش أكتر من 100%)
  const score=targetKcalSum?Math.round(clamp(kcalSum/targetKcalSum*100,0,100)):0;
  return {score,kcal:Math.round(kcalSum),protein:Math.round(proteinSum),carbs:Math.round(carbSum),fat:Math.round(fatSum),
    targetKcal:Math.round(targetKcalSum),loggedDays,totalDays:days.length,mealCount};
}

/* --- 3) الجسم: طاقة داخلة (أكل) مقابل طاقة خارجة (تمرين وحرق) + ماكروز الفترة --- */
function computeBody(days,nutrition,training){
  const ms=S.metrics.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const goal=S.profile.goal;
  // هدف السعرات للفترة (نفس الأرقام اللي التغذية شغالة عليها)
  let targetKcalSum=0; days.forEach(ds=>{ targetKcalSum+=targetFor(ds).kcal; });
  const kcalIn=nutrition.kcal, kcalOut=training.burned;
  const netVsTarget=nutrition.targetKcal?kcalIn-nutrition.targetKcal:0;
  // score: هل صافي الطاقة (أكل - حرق) بيتماشى مع هدفك؟ بنستخدم *نسبة* الفرق من الهدف
  // (مش رقم مطلق) عشان السكور يفضل عادل بغض النظر عن طول الفترة (يوم/أسبوع/شهر)
  let score=60;
  const tgt=nutrition.targetKcal||1;
  const pctOff=netVsTarget/tgt*100; // + يعني فائض، - يعني عجز، كنسبة من الهدف
  if(nutrition.loggedDays===0){
    score=0;
  } else if(goal==='cut'){
    // عايزين عجز خفيف لمتوسط؛ عجز كبير أوي (>25%) مش صحي، وفائض بيبعدك عن الهدف
    score=pctOff<=0?clamp(85+pctOff*0.3,40,90):clamp(85-pctOff*3,0,90);
  } else if(goal==='bulk'){
    // عايزين فائض خفيف (0-15%)؛ عجز أو فائض زيادة كلاهما بعيد عن الهدف
    score=(pctOff>=0&&pctOff<=15)?90:clamp(70-Math.abs(pctOff-7.5)*3,0,90);
  } else {
    // شد عام: كل ما قربت من صفر كل ما أحسن
    score=clamp(90-Math.abs(pctOff)*3,0,90);
  }
  score=Math.round(clamp(score,0,100));
  // اتجاه الوزن لو فيه قياسات كفاية (معلومة إضافية بس مش أساس السكور)
  let weightTrend=null;
  if(ms.length>=2){
    const end=days&&days.length?new Date(days[days.length-1]+'T00:00:00'):new Date();
    const lookbackStart=new Date(end); lookbackStart.setDate(end.getDate()-(days.length-1));
    const lookStr=dstr(lookbackStart);
    const baseline=ms.find(m=>m.date>=lookStr)||ms[0];
    const inRange=ms.filter(m=>m.date<=dstr(end));
    const latest=inRange.length?inRange[inRange.length-1]:ms[ms.length-1];
    if(latest.date!==baseline.date) weightTrend={change:+(latest.weight-baseline.weight).toFixed(1),weightNow:latest.weight};
  }
  return {score,kcalIn,kcalOut,netVsTarget:Math.round(netVsTarget),
    protein:nutrition.protein,carbs:nutrition.carbs,fat:nutrition.fat,
    targetKcal:nutrition.targetKcal,loggedDays:nutrition.loggedDays,totalDays:days.length,
    weightTrend,hasData:nutrition.loggedDays>0};
}

/* --- 4) تطورك (الاستمرارية سابقًا): التزام التسجيل مقابل الإجمالي المطلوب --- */
function computeConsistency(days){
  // "مطلوب منه" = يوم فيه تمرين (لازم يسجل تمرين) + يوم عادي (لازم يسجل أكل على الأقل)
  let required=0, done=0;
  days.forEach(ds=>{
    const mustTrain=isTrainingDay(ds);
    const trained=S.workoutLogs.some(l=>l.date===ds);
    const logged=S.foodLogs.some(l=>l.date===ds);
    if(mustTrain){ required++; if(trained) done++; }
    required++; if(logged) done++; // كل يوم مطلوب فيه تسجيل أكل
  });
  const score=required?Math.round(clamp(done/required*100,0,100)):0;
  const foodDays=days.filter(ds=>S.foodLogs.some(l=>l.date===ds)).length;
  const trainDays=days.filter(ds=>isTrainingDay(ds));
  const trainDone=trainDays.filter(ds=>S.workoutLogs.some(l=>l.date===ds)).length;
  return {score,done,required,foodDays,totalDays:days.length,trainDone,trainTotal:trainDays.length};
}

function progressEngine(period){
  const cur=periodDates(period);
  const training=computeTraining(cur.days);
  const nutrition=computeNutrition(cur.days);
  const body=computeBody(cur.days,nutrition,training);
  const consistency=computeConsistency(cur.days);
  const goal=S.profile.goal;
  return {period,cur,training,nutrition,body,consistency,goal};
}

function animateRings(){
  document.querySelectorAll('[data-ring]').forEach(el=>{
    const target=+el.dataset.ring, color=el.dataset.rcolor||'var(--lime)';
    const num=el.querySelector('.mv');
    const paint=v=>{ el.style.background=`conic-gradient(${color} ${v}%,var(--card2) ${v}%)`;
      if(num) num.textContent=Math.round(v); };
    if(reducedMotion()){ paint(target); return; }
    paint(0);
    const dur=850, t0=performance.now();
    (function step(t){
      const p=Math.min(1,(t-t0)/dur);
      paint(target*(1-Math.pow(1-p,3))); // ease-out cubic
      if(p<1) requestAnimationFrame(step);
    })(t0);
  });
  document.querySelectorAll('.subbar .sf').forEach(el=>{
    const w=el.dataset.w||'0';
    if(reducedMotion()){ el.style.width=w+'%'; return; }
    requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.width=w+'%';}));
  });
}

  const email=V('au_email'),pass=V('au_pass');

  if(pass.length<6){authErr='كلمة السر لازم 6 حروف على الأقل';render();return;}
  authErr='';
  try{
    if(mode==='signup'){
      const {data,error}=await sb.auth.signUp({email,password:pass});
      if(error) throw error;
      // Supabase returns a user but no session when email confirmation is required
      if(data.user&&!data.session){
        authErr='✅ اتبعتلك إيميل تأكيد — افتحه واضغط الرابط، وبعدين ارجع سجّل دخول';

        toast('اتعمل الحساب ✅');

      const {error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error) throw error;
      toast('أهلًا بيك 👋');
    }
  }catch(e){
    const msg=e.message||'';
    if(msg.includes('Invalid login')||msg.includes('invalid_credentials'))
      authErr='الإيميل أو كلمة السر غلط';
    else if(msg.includes('already registered')||msg.includes('already been registered'))
      authErr='الإيميل ده متسجل قبل كده — جرب سجّل دخول';
    else if(msg.includes('Email not confirmed'))
      authErr='لسه ما أكدت الإيميل — افتح الرسالة اللي وصلتك واضغط الرابط';
    else
      authErr=msg||'حصل خطأ، جرب تاني';
  }
  render();

      k==='beginner'?'تمارين أساسية وأجهزة آمنة، 5 تمارين في الحصة':

    }).join('')}`;
  }
  if(obStep===4){
    body=`<div class="q">بتتمرن فين؟</div>
    ${opt('location','gym','جيم مجهّز','كل الأجهزة والكابلات والبار متاحة')}
    ${opt('location','home','بيت / دمبل بس','البرنامج هيختار تمارين بوزن الجسم والدمبل فقط')}`;
  }
  if(obStep===5){
    body=`<div class="q">بياناتك عشان نحسب سعراتك</div>
    <div class="g2">
      <label class="f">العمر<input id="o_age" type="number" inputmode="numeric" value="${ob.age||''}" placeholder="25"></label>
      <label class="f">الوزن (كجم)<input id="o_w" type="number" inputmode="decimal" step="0.1" value="${ob.weight||''}" placeholder="75"></label>

  return `<div class="ob">

function renderFood(){
  const ds=today(), t=targetFor(ds), tot=foodTotals(ds);
  const pool=allFoods();
  const tabs=[['today','اليوم'],['plan','خطة مقترحة'],['lib','مكتبة الوجبات']];
  const tabsHtml=`<div class="tabs">${tabs.map(([k,l])=>`<button class="tb ${foodTab===k?'on':''}" data-a="ftab" data-k="${k}">${l}</button>`).join('')}</div>`;

  const head=`<div class="card">
    <div class="row"><strong style="font-size:13px">إجمالي اليوم</strong>
    <span class="num" style="font-size:19px">${tot.k} / ${t.kcal}</span></div>
    <div style="display:flex;gap:6px;margin-top:9px;flex-wrap:wrap">
      <span class="chip ${tot.p>=t.protein?'c-lime':'c-amb'}">بروتين ${tot.p}/${t.protein}جم</span>
      <span class="chip c-cy">كارب ${tot.c}/${t.carbs}جم</span>
      <span class="chip c-amb">دهون ${tot.f}/${t.fat}جم</span>
    </div></div>`;

  if(foodTab==='today'){
    const logs=S.foodLogs.filter(l=>l.date===ds);
    const list=logs.map(l=>{
      const m=pool.find(x=>x.id===l.mealId); if(!m)return '';
      return `<div class="li"><div><div class="n">${m.name}</div>
        <div class="m">${m.cat} • ×${l.qty} • ${Math.round(m.kcal*l.qty)} سعرة • ${Math.round(m.p*l.qty)}جم بروتين</div></div>
        <button class="ib" data-a="dellog" data-id="${l.id}">🗑</button></div>`;
    }).join('')||`<div class="empty">لسه ما سجلتش وجبات النهارده</div>`;
    return head+tabsHtml+`<div class="card flush"><div style="padding:4px 12px">${list}</div></div>
      <button class="btn p blk" data-a="ftab" data-k="lib">＋ أضف وجبة من المكتبة</button>`;
  }

  if(foodTab==='plan'){
    const plan=S.mealPlan&&S.mealPlan.date===ds?S.mealPlan.meals:null;
    if(!plan){
      return head+tabsHtml+`<div class="card"><div class="empty"><div class="b">🍱</div>
        اضغط لتوليد خطة أكل تناسب ${t.kcal} سعرة و${t.protein}جم بروتين</div>
        <button class="btn p blk" data-a="genplan">ولّد خطة اليوم</button></div>`;
    }
    const loggedIds=new Set(S.foodLogs.filter(l=>l.date===ds).map(l=>l.mealId));
    const allMeals=plan.map(x=>({m:pool.find(m=>m.id===x.id),q:x.qty})).filter(x=>x.m);
    const sum=allMeals.reduce((a,x)=>({k:a.k+x.m.kcal*x.q,p:a.p+x.m.p*x.q,c:a.c+x.m.c*x.q,f:a.f+x.m.f*x.q}),{k:0,p:0,c:0,f:0});
    const meals=allMeals.filter(x=>!loggedIds.has(x.m.id));
    const doneCount=allMeals.length-meals.length;
    const progress=`<div class="card"><div class="row"><strong style="font-size:13px">الخطة المقترحة</strong>

          <div style="font-size:11px;color:var(--faint2);margin-top:4px">${m.cat} • ${m.min} دقيقة تحضير${q!==1?` • حصة ×${q}`:''}</div></div>

        <div style="display:flex;gap:5px;margin-top:9px;flex-wrap:wrap">
          <span class="chip c-lime">${Math.round(m.p*q)}جم بروتين</span><span class="chip c-cy">${Math.round(m.c*q)}جم كارب</span><span class="chip c-amb">${Math.round(m.f*q)}جم دهون</span>

      </div>`).join('')
      +`<button class="btn g blk" data-a="genplan">🔁 ولّد خطة تانية</button>`;
  }

  // library
  const cats=['فطار','غدا','عشا','سناك'];
  return head+tabsHtml+cats.map(c=>`<div class="st">${c}</div>
    ${pool.filter(m=>m.cat===c).map(m=>{
      const op=openMeal===m.id;
      return `<div class="card">
      <div class="row" style="align-items:flex-start">

          <div style="font-size:11px;color:var(--faint2);margin-top:4px">${m.min} دقيقة تحضير${(m.tags||[]).length?' • '+m.tags.join('، '):''}</div>
        </div>
        <span class="chip">${m.kcal} سعرة</span></div>
      <div style="display:flex;gap:5px;margin-top:9px;flex-wrap:wrap">
        <span class="chip c-lime">${m.p}جم بروتين</span><span class="chip c-cy">${m.c}جم كارب</span><span class="chip c-amb">${m.f}جم دهون</span></div>
      ${op?`<div class="div"></div>
        <div style="font-size:11.5px;color:var(--dim);line-height:1.8"><strong style="color:var(--tx)">المكونات:</strong> ${m.ing||'—'}</div>
        <div style="font-size:11.5px;color:var(--dim);line-height:1.8;margin-top:6px"><strong style="color:var(--tx)">التحضير:</strong> ${m.steps||'—'}</div>`:''}

    </div>`;}).join('')}`).join('')+
  `<button class="btn g blk" data-a="showcustom" style="margin-top:6px">＋ أضف وجبة من عندك</button>
   <div id="customBox" class="card" style="display:none;margin-top:10px">
     <div class="g2"><label class="f">الاسم<input id="cf_n"></label>
     <label class="f">النوع<select id="cf_c">${cats.map(c=>`<option>${c}</option>`).join('')}</select></label></div>

function renderSchedule(){
  const restSet=new Set(currentRestDays());
  const isRest=restSet.has(schedDay);
  const sess=S.program?S.program.week.find(d=>d.dow===schedDay):null;
  const needed=(sess&&!isRest?sess.minutes:45)+10; // +10 min buffer for commute/shower

  const strip=[0,1,2,3,4,5,6].sort((a,b)=>((a+1)%7)-((b+1)%7)) // Sat..Fri order to match rest of app
    .map(dow=>`<div class="dc ${dow===schedDay?'act':''}" data-a="schedday" data-dow="${dow}">
      <div class="dn">${DAYS_SH[dow]}</div>
      <div class="dd">${restSet.has(dow)?'راحة':'تمرين'}</div></div>`).join('');

  const tasks=tasksFor(schedDay);
  const taskList=tasks.length?tasks.map(t=>{
    const tt=TASK_TYPES[t.type]||TASK_TYPES.work;
    return `<div class="li"><div><div class="n">${tt.icon} ${t.title}</div>
      <div class="m">${t.start} — ${t.end} <span class="chip ${tt.chip}" style="margin-inline-start:5px">${tt.label}</span></div></div>
      <button class="ib" data-a="deltask" data-dow="${schedDay}" data-id="${t.id}">✕</button></div>`;
  }).join(''):'<div class="empty" style="padding:14px 0"><div class="b">🗓️</div>مفيش مهام مسجلة النهارده</div>';

  const addForm=showAddTask?`<div style="padding:10px 4px 4px">
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
      ${Object.keys(TASK_TYPES).map(k=>`<button class="chip ${addTaskType===k?TASK_TYPES[k].chip:''}" data-a="picktasktype" data-k="${k}"
        style="cursor:pointer;border:1px solid var(--line)">${TASK_TYPES[k].icon} ${TASK_TYPES[k].label}</button>`).join('')}
    </div>
    <label class="f">اسم المهمة (اختياري)<input id="tk_title" type="text" placeholder="${TASK_TYPES[addTaskType].label}"></label>
    <div class="g2">
      <label class="f">من<input id="tk_s" type="time" value="09:00"></label>
      <label class="f">لـ<input id="tk_e" type="time" value="10:00"></label>
    </div>
    <button class="btn p blk" data-a="addtask" data-dow="${schedDay}" style="margin-top:4px">إضافة المهمة</button>
  </div>`:'';

  let gymSuggestion='';
  if(!isRest){
    const avail=bucketAvailability(schedDay,needed);
    const pref=S.gymTimePref&&S.gymTimePref[schedDay];
    gymSuggestion=`<div class="st">🎯 أنسب معاد للجيم — محتاج ${needed} دقيقة</div>
    <div class="card flush"><div style="padding:4px 12px">
    ${avail.map(b=>`<div class="li">
      <div><div class="n">${b.icon} ${b.label}</div>
      <div class="m">${b.free?`متاح ${fmtHM(b.slotStart)} — ${fmtHM(b.slotEnd)}`:'مفيش وقت كفاية'}</div></div>
      ${b.free?`<button class="btn ${pref&&pref.bucket===b.key?'p':'g'} sm" data-a="setgymtime" data-dow="${schedDay}" data-bucket="${b.key}" data-start="${b.slotStart}" data-end="${b.slotEnd}">
        ${pref&&pref.bucket===b.key?'✓ مختار':'اختار ده'}</button>`:''}
      </div>`).join('')}
    </div></div>`;
  }

  return `<div class="st">🗓️ جدولك الأسبوعي</div>
  <div class="card flush"><div style="padding:10px 8px 4px;display:flex;gap:7px;overflow-x:auto">${strip}</div>
    <div style="padding:8px 12px 12px">
      <button class="btn ${isRest?'p':'g'} sm blk" data-a="togglerest" data-dow="${schedDay}">
        ${isRest?'☀️ خليه يوم تمرين':'😴 خليه يوم راحة'}</button>
    </div>
  </div>
  <div class="card flush"><div style="padding:4px 12px">${taskList}</div>
    ${addForm}
    <div style="padding:8px 12px 12px">
      <button class="btn g sm blk" data-a="toggleaddtask">${showAddTask?'إلغاء':'+ إضافة مهمة'}</button>
    </div>
  </div>
  ${gymSuggestion}`;
}

    ${permBtn}

  <div class="card" style="font-size:11px;color:var(--faint2);line-height:1.8;margin-bottom:14px">

  </div>

  <div class="card">

/* ================= PROGRESS DASHBOARD ================= */
const RING_DEFS=[
  {k:'training',  label:'التمرين',  icon:'🏋️', c:'var(--lime)'},
  {k:'nutrition', label:'التغذية',  icon:'🍽',  c:'var(--cyan)'},
  {k:'body',      label:'الجسم',    icon:'⚖️', c:'var(--violet)'},
  {k:'consistency',label:'تطورك',   icon:'📋',c:'var(--amber)'}
];
function subbar(label,pct,val,color){
  const p=clamp(Math.round(pct),0,100);
  return `<div class="subbar"><div class="sl">${label}</div>
    <div class="stk"><div class="sf" data-w="${p}" style="background:${color}"></div></div>
    <div class="sv">${val}</div></div>`;
}
function ringTier(s){return s>=80?'ممتاز 🔥':s>=60?'كويس 👍':s>=40?'شد حيلك 💪':s<10?'ابدأ سجّل 📝':'يلا نرجع بقوة';}
function periodLabel(period){return period==='day'?'النهارده':period==='week'?'آخر 7 أيام':'آخر 30 يوم';}

  const t=pe.training, d=RING_DEFS[0];
  return `<div class="card">

/* ================= AI COACH ================= */
// النداء الحقيقي بيروح لـ Supabase Edge Function اسمها ai-chat، وهي اللي بتكلم
// Anthropic API فعليًا (المفتاح مخبّى في متغيرات بيئة السيرفر، مش هنا خالص)،
// وهي كمان اللي بتستهلك الكريدت من قاعدة البيانات (شوف supabase/functions/ai-chat).
const AI_SYSTEM_SCOPE=`إنت مدرب شخصي داخل تطبيق Fitness OS Pro، ودود ومحفّز وواثق من نفسه، وعارف عن العميل أكتر من أي مدرب بشري لأنك شايف كل بياناته الفعلية أول بأول: تمرينه، أكله، وزنه، جدوله، والتزامه. بترد بأسلوب شخصي ودافئ مبني على أرقامه هو بالظبط — مش نصايح عامة. بترد على أسئلة عن: برنامج التمرين، التغذية، السجل والتقدم، مواعيد الجدول. أي سؤال برّه النطاق ده، اعتذر بلطف ووجّه المستخدم يسأل حاجة متعلقة بالتطبيق. خليك مختصر جدًا: رد بحوالي 30 كلمة أو أقل في العادي، وزوّد بس لو السؤال فعلاً محتاج تفصيل أو خطوات.`;
function buildAiContext(){
  const ds=today(), dow=new Date().getDay();
  const sess=sessionFor(dow), t=targetFor(ds), tot=foodTotals(ds), pe=progressEngine('month');
  return `بيانات العميل الحالية:
- الهدف: ${GOALS[S.profile.goal].label}, مستوى ${LEVELS[S.profile.level].label}
- تمرين اليوم: ${sess&&!sess.rest?sess.name+' — '+sess.groups.join('، '):'يوم راحة'}
- ستريك الالتزام: ${streak()} يوم متتالي
- أكل اليوم: ${tot.k}/${t.kcal} سعرة، ${tot.p}/${t.protein}جم بروتين
- تقدم الشهر: سكور عام ${pe.composite}/100${pe.body&&pe.body.weightTrend?`، الوزن اتغير ${pe.body.weightTrend.change>=0?'+':''}${pe.body.weightTrend.change}كجم لحد ${pe.body.weightTrend.weightNow}كجم`:''}
رد على سؤال العميل بناءً على البيانات دي فقط. اكتب ردك كنص عادي فقط بدون أي Markdown — من غير #، **، أو قوائم مرقمة، فقط جمل طبيعية وممكن تستخدم سطر جديد بسيط بين الأفكار.`;
}
function sanitizeAiText(s){
  return s
    .replace(/```[\s\S]*?```/g,'')
    .replace(/^#{1,6}\s*/gm,'')
    .replace(/\*\*(.*?)\*\*/g,'$1')
    .replace(/\*(.*?)\*/g,'$1')
    .replace(/^[-*]\s+/gm,'• ')
    .replace(/^\d+\.\s+/gm,'')
    .replace(/\n{3,}/g,'\n\n')
    .trim();
}
function capWords(s,n){
  const words=s.split(/\s+/);
  return words.length<=n?s:words.slice(0,n).join(' ')+'…';
}
async function callAiCoach(system,messages,max_tokens){
  if(!CLOUD_ENABLED||!sb||!sbUser){
    console.error('[ai-chat] blocked before call — CLOUD_ENABLED:',CLOUD_ENABLED,'sb:',!!sb,'sbUser:',!!sbUser);
    throw Object.assign(new Error('cloud_unavailable'),{code:'cloud_unavailable'});
  }
  const {data,error}=await sb.functions.invoke('ai-chat',{body:{system,messages,max_tokens}});
  if(error){
    let payload=null,rawText=null,status=null;
    try{ status=error.context&&error.context.status; }catch(e){}
    try{ rawText=error.context&&typeof error.context.text==='function'?await error.context.clone().text():null; }catch(e){}
    try{ payload=error.context&&typeof error.context.json==='function'?await error.context.json():null; }catch(e){}
    // اطبع كل حاجة نعرفها عن الخطأ في الكونسول — ده اللي هيوريك السبب الحقيقي
    // (افتح Developer Tools > Console وابعتلي اللي هيظهر هنا لما تسأل سؤال)
    console.error('[ai-chat] invoke failed:',{message:error.message,status,payload,rawText,error});
    if(payload&&payload.error==='out_of_credits'){
      if(typeof payload.daily_left==='number') aiCreditsDailyLeft=payload.daily_left;
      if(typeof payload.monthly_left==='number') aiCreditsMonthlyLeft=payload.monthly_left;
      throw Object.assign(new Error('out_of_credits'),{code:'out_of_credits'});
    }
    throw error;
  }
  if(data&&typeof data.daily_left==='number') aiCreditsDailyLeft=data.daily_left;
  if(data&&typeof data.monthly_left==='number') aiCreditsMonthlyLeft=data.monthly_left;
  if(data&&data.text) return data.text;
  console.error('[ai-chat] empty response, data was:',data);
  throw new Error('empty AI response');
}
// رد احتياطي محلي بسيط — بيتفعّل بس لو الاتصال بالسيرفر نفسه فشل (أوفلاين مثلاً)،
// ومش بيتفعّل أبدًا لو السبب إن الرصيد خلص، عشان محدش يقدر يلف على حد الكريدت.
function offlineFallbackReply(userMsg){
  const msg=userMsg.toLowerCase();
  if(/تمرين|حصة|برنامج|عضل/.test(userMsg)){
    const dow=new Date().getDay(); const sess=sessionFor(dow);
    if(sess&&!sess.rest) return `حصة النهارده "${sess.name}" وبتستهدف ${sess.groups.join(' + ')} — يلا نوريها! عندك ${sess.exercises.length} تمارين، افتح تبويب التمارين وشوفهم بالتفصيل. أنا معاك خطوة بخطوة 💪 عايزني أساعدك في حاجة تانية عن التمرين؟`;
    return `النهارده يوم راحة — وده مش كسل، ده جزء من الخطة. العضلة بتكبر وقت الراحة مش وقت التمرين 💪 استمتع بيومك وهنشوف بكرة قوية.`;
  }
  if(/اكل|تغذي|بروتين|سعر/.test(userMsg)){
    const t=targetFor(today()), tot=foodTotals(today());
    return `هدفك النهارده ${t.kcal} سعرة و${t.protein}جم بروتين. لحد دلوقتي سجّلت ${tot.k} سعرة و${tot.p}جم بروتين — متبقي ${Math.max(0,t.kcal-tot.k)} سعرة بس. كمّل كده وهتوصل لهدفك براحة.`;
  }
  if(/معاد|جدول|موعد/.test(userMsg)){
    return `تقدر تدير جدولك وتحدد ميعاد الجيم من تبويب "حسابي" تحت قسم الجدول الأسبوعي. عايزني أفكّرك بحاجة معينة؟`;
  }
  if(/وزن/.test(userMsg)){
    const pe=progressEngine('month');
    if(!pe.body||!pe.body.weightTrend) return 'لسه ملكش قياسات كفاية — سجّل وزنك كل شوية، وأنا هتابع كل غرام معاك.';
    const wt=pe.body.weightTrend;
    return `وزنك اتغير ${wt.change>=0?'+':''}${wt.change}كجم آخر شهر، ودلوقتي ${wt.weightNow}كجم. أنا شايف كل رقم بتسجله، وده مسار كويس.`;
  }
  if(/تعب|مرهق|ستريك/.test(userMsg)){
    const st=streak();
    return `عندك ${st} يوم ستريك دلوقتي — ده مجهود حقيقي مش سهل. لو حاسس متعب، يوم راحة إضافي مش هيضرّك — بس حاول ما تسيبش كتير يوم ورا بعض. أنا هفضل اتفق معاك مش أدفعك.`;
  }
  return `مش قادر أوصل للسيرفر دلوقتي (ممكن يكون النت مقطوع). جرّب تاني بعد شوية — اسألني عن التمرين، الأكل، الوزن، أو الستريك.`;
}

function dailyCoachMessage(){
  const t=today();
  if(S.coachDaily&&S.coachDaily.date===t) return S.coachDaily.text;
  const st=streak(); const pe=progressEngine('week');
  const parts=[];
  parts.push(st>0?`عامل ستريك ${st} يوم متتالي — استمرارية زي دي بتفرق فعلاً`:'لسه ما سجلتش حاجة النهاردة، ابدأ بحاجة صغيرة وسجّلها');
  if(pe.nutrition&&pe.nutrition.loggedDays>0){

  S.coachDaily={date:t,text:text||'يلا نبدأ نسجل عشان أقدر أتابعك صح'};

function pickCoachPersona(){

  if(st===0&&!foodOk) return {key:'حنون وعطوف',note:'العميل مقصّر في التسجيل من فترة — رسالة تشجيع دافئة من غير لوم'};
  if(trainOk!==null&&trainOk<60) return {key:'صارم',note:'العميل بيفوّت أيام تمرين كتير — رسالة حازمة بس محترمة تدفعه يرجع للجدول'};
  if(st>=7&&(trainOk===null||trainOk>=85)) return {key:'مدرب محترف',note:'العميل ملتزم جدًا — رسالة احترافية فخورة بيه وبتدفعه للمستوى الجاي'};

async function sendAiMessage(){
  const inputEl=document.getElementById('ai_input');
  const text=inputEl?inputEl.value.trim():'';
  if(!text) return;
  // فحص تفاؤلي سريع بس (تجربة استخدام أفضل) — الفحص الحقيقي والملزم بيحصل في السيرفر
  const optimistic=aiCreditsLeft();
  if(optimistic.known&&optimistic.daily<=0){ toast('خلص رصيدك اليومي من الـ AI Coach — هيتجدد بكرة'); return; }
  if(optimistic.known&&optimistic.monthly<=0){ toast('خلص رصيدك الشهري من الـ AI Coach'); return; }
  if(!S.aiChat) S.aiChat=[];
  S.aiChat.push({role:'user',text});
  if(inputEl) inputEl.value='';
  render();
  let reply;
  try{
    const raw=await callAiCoach(AI_SYSTEM_SCOPE+'\n\n'+buildAiContext(),[{role:'user',content:text}],400);
    reply=sanitizeAiText(raw.trim());
  }catch(e){
    if(e&&e.code==='out_of_credits'){
      S.aiChat.pop(); // اتشالت من الشات لأنه ما اتبعتش فعليًا — ما استهلكش كريدت
      render();
      const left=aiCreditsLeft();
      toast(left.daily<=0?'خلص رصيدك اليومي من الـ AI Coach — هيتجدد بكرة':'خلص رصيدك الشهري من الـ AI Coach');
      return;
    }
    console.error('[ai-chat] falling back to canned reply because:',e);
    reply=offlineFallbackReply(text);
  }
  S.aiChat.push({role:'ai',text:reply});
  await save();
  render();
  setTimeout(()=>{ const cl=document.getElementById('chatlog'); if(cl) cl.scrollTop=cl.scrollHeight; },50);
}

async function act(a,d,el){

  if(a==='authswitch'){authMode=authMode==='signup'?'login':'signup';authErr='';render();return;}
  if(a==='authskip'){guestMode=true;render();return;}
  if(a==='authshow'){guestMode=false;render();return;}
  if(a==='authlogout'){await doLogout();return;}
  if(a==='upgradepro'){await requestUpgrade();return;}
  if(a==='starttrial'){
    if(!CLOUD_ENABLED||!sbUser){toast('لازم تسجّل دخول الأول');return;}

  }

  if(a==='aiquick'){const inp=document.getElementById('ai_input');if(inp){inp.value=el.dataset.q;await sendAiMessage();}return;}

  if(a==='toggledaily'){dailyMsgOpen=!dailyMsgOpen;render();return;}
  if(a==='setlock'){

    await setAppLockOverride(v);toast('اتحفظ الإعداد وهيتطبق على كل المستخدمين');render();return;
  }
  if(a==='ob'){ob[d.k]=d.v;obStep++;render();return;}
  if(a==='obdays'){ob.daysPerWeek=+d.n;ob.split=d.sp;obStep++;render();return;}
  if(a==='obback'){obStep=Math.max(0,obStep-1);render();return;}
  if(a==='obfinish'){
    const age=+V('o_age'),w=+V('o_w'),h=+V('o_h');
    if(!age||!w||!h){toast('اكمل بياناتك الأول');return;}
    const actEl=document.getElementById('o_act');

    await withLoadingSkeleton(()=>{
      S.profile={...ob,age,weight:w,height:h,activity};

      S.metrics.push({id:uid(),date:today(),weight:w});
    });
    await save();toast('برنامجك جاهز 🚀');tab='home';render();scheduleToday();return;
  }
  if(a==='go'){tab=d.t;render();return;}
  if(a==='opennotif'){if(tab!=='notif')prevTab=tab;markAllNotifsRead();tab='notif';await save();render();return;}
  if(a==='openprogress'){if(tab!=='progress')prevTab=tab;tab='progress';render();return;}
  if(a==='progperiod'){progPeriod=d.k;render();return;}
  if(a==='progring'){progRing=d.k;render();return;}
  if(a==='openring'){if(tab!=='progress')prevTab=tab;progRing=d.k;progPeriod='day';tab='progress';render();return;}
  if(a==='togglenotif'){
    const cur=getPath(S.notifSettings,d.path);
    setPath(S.notifSettings,d.path,!cur);
    await save();scheduleToday();render();return;
  }
  if(a==='reqnotifperm'){await requestNotifPermission();return;}
  if(a==='clearnotifs'){S.notifLog=[];await save();render();return;}
  if(a==='selday'){selDay=+d.d;render();return;}
  if(a==='ftab'){foodTab=d.k;render();return;}
  if(a==='open'){tab='plan';selDay=new Date().getDay();render();return;}
  if(a==='exdet'){if(tab!=='ex')prevTab=tab;exId=d.id;tab='ex';render();return;}
  if(a==='back'){tab=prevTab;render();return;}
  if(a==='openmeal'){openMeal=openMeal===d.id?null:d.id;render();return;}

  if(a==='schedday'){schedDay=+d.dow;showAddTask=false;render();return;}
  if(a==='togglerest'){
    const dow=+d.dow;
    let rd=currentRestDays();
    rd=rd.includes(dow)?rd.filter(x=>x!==dow):[...rd,dow];
    S.restDaysCustom=rd;
    S.program=buildProgram(S.profile,S.restDaysCustom);
    await save();toast(rd.includes(dow)?'اتحدد يوم راحة 😴':'اتحول ليوم تمرين 💪');render();scheduleToday();return;
  }
  if(a==='toggleaddtask'){showAddTask=!showAddTask;render();return;}
  if(a==='picktasktype'){addTaskType=d.k;render();return;}
  if(a==='addtask'){
    const dow=+d.dow;
    const start=V('tk_s'),end=V('tk_e'),title=V('tk_title');

  }
  if(a==='deltask'){
    const dow=+d.dow;
    S.weekTasks[dow]=(S.weekTasks[dow]||[]).filter(t=>t.id!==d.id);
    await save();render();return;
  }
  if(a==='setgymtime'){
    const dow=+d.dow,bucket=d.bucket,start=+d.start,end=+d.end;

    S.workoutLogs=S.workoutLogs.filter(l=>!(l.date===today()&&l.exerciseId===id));
    let saved=0;
    for(let i=0;i<n;i++){
      const wv=+V(`w_${id}_${i}`);
      if(!wv)continue;
      const rv=cardio?0:+V(`r_${id}_${i}`);

      saved++;

    await save();toast(saved?`تم حفظ ${saved} مجموعة 💪`:'ما فيش بيانات مدخلة');render();return;
  }
  if(a==='swap'){
    const e=EX_BY_ID[d.id];
    const alt=(e.alts||[]).map(x=>EX_BY_ID[x]).filter(Boolean)[0];
    if(!alt){toast('مفيش بديل متاح');return;}
    const s=sessionFor(+d.d);
    s.exercises=s.exercises.map(x=>x===d.id?alt.id:x);
    await save();toast('تم استبدال التمرين بـ '+alt.name);render();return;
  }
  if(a==='regen'){
    await withLoadingSkeleton(()=>{ S.program=buildProgram(S.profile,S.restDaysCustom); });
    await save();toast('تم توليد برنامج جديد');tab='plan';render();scheduleToday();return;
  }
  if(a==='genplan'){
    await withLoadingSkeleton(()=>{
      const t=targetFor(today());
      S.mealPlan={date:today(),meals:generateMealPlan(t.kcal,t.protein)};
    });
    await save();foodTab='plan';render();return;
  }
  if(a==='addmeal'){
    S.foodLogs.push({id:uid(),date:today(),mealId:d.id,qty:+(d.q||1)});
    await save();toast('تمت إضافة الوجبة');render();return;
  }
  if(a==='dellog'){S.foodLogs=S.foodLogs.filter(l=>l.id!==d.id);await save();render();return;}
  if(a==='showcustom'){const b=document.getElementById('customBox');b.style.display=b.style.display==='none'?'block':'none';return;}
  if(a==='savecustom'){
    const n=V('cf_n');if(!n){toast('اكتب اسم الوجبة');return;}
    S.customFoods.push({id:uid(),name:n,cat:document.getElementById('cf_c').value,
      kcal:+V('cf_k')||0,p:+V('cf_p')||0,c:+V('cf_c2')||0,f:+V('cf_f')||0,min:5,tags:['من عندي'],ing:'—',steps:'—'});
    await save();toast('تمت الإضافة');render();return;
  }
  if(a==='savemetric'){
    const w=+V('mw');if(!w){toast('أدخل الوزن');return;}
    S.metrics.push({id:uid(),date:today(),weight:w,bf:+V('mf')||null,chest:+V('mc')||null,waist:+V('mws')||null,arm:+V('ma')||null});
    S.profile.weight=w;
    await save();toast('تم حفظ القياس');render();return;
  }
  if(a==='delmetric'){S.metrics=S.metrics.filter(m=>m.id!==d.id);await save();render();return;}
  if(a==='saveprofile'){
    S.profile={...S.profile,weight:+V('p_w')||S.profile.weight,height:+V('p_h')||S.profile.height,
      age:+V('p_a')||S.profile.age,gender:document.getElementById('p_g').value,
      activity:document.getElementById('p_act').value,goal:document.getElementById('p_goal').value};
    S.program=buildProgram(S.profile,S.restDaysCustom);
    await save();toast('تم التحديث وإعادة بناء البرنامج');render();scheduleToday();return;
  }
  if(a==='redo'){
    clearNotifTimers();
    ob={...S.profile}; obStep=0; S.profile=null; S.program=null; S.restDaysCustom=null;
    await save(); toast('ابدأ التسجيل من الأول'); render(); return;
  }
  if(a==='reset'){
    if(el.dataset.armed!=='1'){
      el.dataset.armed='1';
      el.textContent='اضغط تاني للتأكيد — المسح نهائي';
      el.classList.remove('d'); el.classList.add('p');

      return;
    }
    clearNotifTimers();S=blank();ob={};obStep=0;tab='home';await save();toast('تم المسح بالكامل');render();return;
  }
}

  if(!btn||btn.disabled) return;
  const rect=btn.getBoundingClientRect();
  const size=Math.max(rect.width,rect.height)*1.7;
  const r=document.createElement('span');
  r.className='ripple';
  r.style.width=r.style.height=size+'px';
  const cx=(e.clientX||rect.left+rect.width/2)-rect.left-size/2;
  const cy=(e.clientY||rect.top+rect.height/2)-rect.top-size/2;
  r.style.left=cx+'px'; r.style.top=cy+'px';
  btn.appendChild(r);
  r.addEventListener('animationend',()=>r.remove());
});

/* ================= SKY THEME ================= */
function skyPhase(){
  const h=new Date().getHours();
  if(h>=6&&h<17) return 'day';
  if(h>=17&&h<20) return 'dusk';
  return 'night';
}
function applySkyTheme(){
  const layer=document.getElementById('skyLayer'), decor=document.getElementById('skyDecor');
  if(!layer||!decor) return;
  const phase=skyPhase();
  if(layer.dataset.phase===phase) return;
  layer.dataset.phase=phase;
  const grads={
    day:'linear-gradient(180deg,#16324a 0%,#1c3f57 45%,var(--bg) 88%)',
    dusk:'linear-gradient(180deg,#2a1f42 0%,#4a2438 40%,#5e3320 65%,var(--bg) 92%)',
    night:'linear-gradient(180deg,#050712 0%,#0b0f22 50%,var(--bg) 92%)'
  };
  layer.style.background=grads[phase];
  decor.innerHTML='';
  if(phase==='day'){
    for(let i=0;i<4;i++){
      const c=document.createElement('div'); c.className='cloud';
      const w=60+Math.random()*70, y=8+Math.random()*22, dur=38+Math.random()*30, delay=-Math.random()*dur;
      c.style.cssText=`width:${w}px;height:${w*.34}px;top:${y}%;animation-duration:${dur}s;animation-delay:${delay}s`;
      decor.appendChild(c);
    }
  } else if(phase==='night'){
    const moon=document.createElement('div'); moon.className='moon';
    moon.style.cssText='width:46px;height:46px;top:6%;left:72%';
    decor.appendChild(moon);
    for(let i=0;i<28;i++){
      const s=document.createElement('div'); s.className='star';
      const sz=1+Math.random()*1.8;
      s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*45}%;left:${Math.random()*100}%;
        animation-duration:${2+Math.random()*3}s;animation-delay:${-Math.random()*4}s`;
      decor.appendChild(s);
    }
  }
}
setInterval(applySkyTheme,5*60*1000);

    if(!el||!sbTrialStart) return;
    const r=trialRemaining();
    if(r.totalMs<=0){ render(); return; }
    el.textContent=String(r.h).padStart(2,'0')+':'+String(r.m).padStart(2,'0')+':'+String(r.s).padStart(2,'0');
  },1000);
})();
</script></body></html>
